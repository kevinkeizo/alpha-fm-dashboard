<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha FM · Instagram Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #3D5BFE;
  --primary-dark: #2D3F9E;
  --primary-light: #5470FF;
  --bg: #F8F9FC;
  --surface: #FFFFFF;
  --surface-light: #F3F4FA;
  --text-1: #0F1419;
  --text-2: #5C5F73;
  --text-3: #8B8D9A;
  --success: #10B981;
  --danger: #EF4444;
  --accent: #FF6B35;
  --font-display: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: linear-gradient(135deg, var(--bg) 0%, #EFF0F7 100%);
  color: var(--text-1);
  font-family: var(--font-display);
  position: relative;
  animation: gradientShift 15s ease-in-out infinite;
}

@keyframes gradientShift {
  0%, 100% {
    background: linear-gradient(135deg, var(--bg) 0%, #EFF0F7 100%);
  }
  50% {
    background: linear-gradient(135deg, #F0F2FA 0%, #E8EAFC 100%);
  }
}

#canvas-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  opacity: 0.15;
  animation: floatBg 20s ease-in-out infinite;
}

@keyframes floatBg {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(20px); }
}

.wrap {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 40px;
  gap: 16px;
  border-bottom: 1px solid rgba(61, 91, 254, 0.08);
  backdrop-filter: blur(20px);
  background: rgba(248, 249, 252, 0.6);
  position: sticky;
  top: 0;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 12px rgba(61, 91, 254, 0.2));
  transition: transform 0.3s ease;
}

.brand-logo:hover {
  transform: scale(1.05);
}

.brand-text h1 {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--text-1);
}

.brand-text p {
  font-size: 12px;
  color: var(--text-2);
  font-family: var(--font-mono);
  margin-top: 2px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.status-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  color: var(--success);
  font-family: var(--font-mono);
}

.live-dot {
  width: 6px;
  height: 6px;
  background: var(--success);
  border-radius: 50%;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.icon-btn:hover {
  background: rgba(61, 91, 254, 0.1);
  border-color: var(--primary);
  color: var(--primary);
}

.icon-btn svg {
  width: 16px;
  height: 16px;
}

/* Main content */
.container {
  padding: 40px;
  max-width: 1400px;
  margin: 0 auto;
}

/* Hero Card - MEGA */
.hero-card {
  background: linear-gradient(135deg, rgba(61, 91, 254, 0.08) 0%, rgba(84, 112, 255, 0.04) 100%);
  border: 1px solid rgba(61, 91, 254, 0.2);
  border-radius: 24px;
  padding: 48px;
  margin-bottom: 40px;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(61, 91, 254, 0.15);
  animation: fadeUp 0.8s ease-out;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-top {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 40px;
  margin-bottom: 0;
  align-items: stretch;
}

@media (max-width: 900px) {
  .hero-top {
    grid-template-columns: 1fr;
    gap: 32px;
  }
}

/* Total Seguidores */
.hero-top > div:first-child {
  display: flex;
  flex-direction: column;
  gap: 20px;
  justify-content: flex-start;
}

.hero-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-2);
}

.hero-value {
  font-size: 72px;
  font-weight: 900;
  font-family: var(--font-mono);
  background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 0.9;
  letter-spacing: -0.03em;
}

/* Ganho Diário - BOX DESTAQUE */
.hero-top > div:last-child {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 32px;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(34, 197, 94, 0.06) 100%);
  border: 2px solid rgba(16, 185, 129, 0.4);
  border-radius: 16px;
  backdrop-filter: blur(10px);
}

.hero-top > div:last-child .hero-label {
  color: var(--success);
  font-size: 11px;
}

.hero-top > div:last-child .hero-value {
  background: linear-gradient(135deg, var(--success) 0%, #10B981 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-size: 52px;
}

.hero-top > div:last-child .stat-delta {
  font-size: 13px;
  font-weight: 700;
  color: var(--success);
  background: transparent;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 8px;
}

/* Comparativos */
.hero-chips {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  padding-top: 16px;
  border-top: 1px solid rgba(61, 91, 254, 0.15);
}

.chip {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 10px 12px;
  background: rgba(61, 91, 254, 0.08);
  border-radius: 8px;
  border: 1px solid rgba(61, 91, 254, 0.15);
}

.chip-label {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  font-weight: 600;
}

.chip-value {
  font-size: 14px;
  font-weight: 800;
  font-family: var(--font-mono);
  color: var(--primary-light);
}

/* Stat Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 40px;
}

@media (max-width: 1200px) {
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
}

@media (max-width: 600px) {
  .stats-grid {
    grid-template-columns: 1fr;
  }
}

.stat-card {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
  border: 1px solid rgba(61, 91, 254, 0.2);
  border-radius: 16px;
  padding: 28px;
  backdrop-filter: blur(10px);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  animation: fadeUp 0.8s ease-out;
  animation-fill-mode: both;
}

.stat-card:nth-child(1) { animation-delay: 0.1s; }
.stat-card:nth-child(2) { animation-delay: 0.2s; }
.stat-card:nth-child(3) { animation-delay: 0.3s; }
.stat-card:nth-child(4) { animation-delay: 0.4s; }

.stat-card:hover {
  background: linear-gradient(135deg, rgba(61, 91, 254, 0.12) 0%, rgba(84, 112, 255, 0.06) 100%);
  border-color: var(--primary);
  transform: translateY(-8px);
  box-shadow: 0 20px 50px rgba(61, 91, 254, 0.2);
}

.stat-card-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text-2);
  margin-bottom: 12px;
}

.stat-card-value {
  font-size: 36px;
  font-weight: 900;
  font-family: var(--font-mono);
  color: var(--primary-light);
  line-height: 1;
  margin-bottom: 12px;
  letter-spacing: -0.02em;
}

.stat-card-delta {
  font-size: 12px;
  font-family: var(--font-mono);
  font-weight: 600;
  padding: 0;
  background: transparent;
}

.delta-up {
  color: var(--success);
}

.delta-down {
  color: var(--danger);
}

.delta-flat {
  color: var(--text-3);
}

/* Charts */
.chart-section {
  background: linear-gradient(135deg, rgba(61, 91, 254, 0.08) 0%, rgba(84, 112, 255, 0.04) 100%);
  border: 1px solid rgba(61, 91, 254, 0.2);
  border-radius: 20px;
  padding: 32px;
  margin-bottom: 30px;
  backdrop-filter: blur(20px);
  animation: fadeUp 0.8s ease-out 0.5s both;
}

.chart-title {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text-1);
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chart-filters {
  display: flex;
  gap: 10px;
}

.filter-btn {
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid rgba(61, 91, 254, 0.2);
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-mono);
}

.filter-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.filter-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.chart-holder {
  height: 280px;
  position: relative;
}

/* TV Mode */
body.tv-mode {
  padding: 0;
}

body.tv-mode .header {
  padding: 20px 40px;
}

body.tv-mode .container {
  padding: 32px 40px;
}

body.tv-mode .hero-card {
  padding: 40px;
  margin-bottom: 20px;
}

body.tv-mode .hero-top {
  gap: 40px;
  margin-bottom: 0;
}

body.tv-mode .hero-value {
  font-size: 64px;
}

body.tv-mode .hero-top > div:last-child {
  padding: 24px;
}

body.tv-mode .hero-top > div:last-child .hero-value {
  font-size: 44px;
}

body.tv-mode .stats-grid {
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 0;
}

body.tv-mode .stat-card {
  padding: 20px;
}

body.tv-mode .stat-card-value {
  font-size: 32px;
}

body.tv-mode .chart-section {
  display: none;
}

body.tv-mode .header-actions .icon-btn:not(#btn-tv) {
  display: none;
}

/* Scroll */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(61, 91, 254, 0.3);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(61, 91, 254, 0.5);
}

/* Loading */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 60px 0;
}

.spin {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(61, 91, 254, 0.2);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<canvas id="canvas-bg"></canvas>

<div class="wrap">
  <div class="header">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3D5BFE;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#5470FF;stop-opacity:1" />
          </linearGradient>
        </defs>
        <rect width="200" height="200" rx="36" fill="url(#logoGrad)"/>
        <text x="100" y="105" font-family="Inter, sans-serif" font-size="80" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-2" dominant-baseline="middle">alpha</text>
        <text x="100" y="155" font-family="Inter, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle" letter-spacing="1">FM 101.7</text>
      </svg>
      <div class="brand-text">
        <h1>Alpha FM · Instagram</h1>
        <p id="brand-subtitle">@radiosalphafm · atualizado agora</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="status-chip"><span class="live-dot"></span>ao vivo</span>
      <div class="icon-btn" id="btn-tv" title="Modo TV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
      </div>
      <div class="icon-btn" id="btn-refresh" title="Atualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      </div>
    </div>
  </div>

  <div class="container" id="app">
    <div class="loading"><div class="spin"></div> carregando</div>
  </div>
</div>

<script>
// Three.js Background
const canvas = document.getElementById('canvas-bg');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
camera.position.z = 5;

// Partículas de fundo
const particlesGeometry = new THREE.BufferGeometry();
const particleCount = 300;
const positions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount * 3; i += 3) {
  positions[i] = (Math.random() - 0.5) * 20;
  positions[i + 1] = (Math.random() - 0.5) * 20;
  positions[i + 2] = (Math.random() - 0.5) * 20;
}

particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const particlesMaterial = new THREE.PointsMaterial({
  color: 0x5470FF,
  size: 0.08,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.4,
});

const particles = new THREE.Points(particlesGeometry, particlesMaterial);
scene.add(particles);

// Animação
function animate() {
  requestAnimationFrame(animate);
  particles.rotation.x += 0.0001;
  particles.rotation.y += 0.0002;
  renderer.render(scene, camera);
}

animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const API_URL = 'https://alpha-fm-api-git-main-alpha-fm1.vercel.app/api/data';
const LOGO_SRC = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAACXBIWXMAABcSAAAXEgFxLsqaAAAA20lEQVQYV5XRMQ7CMBBFUYrEVliQkJhYmZiZWBhYWViYuAEn4AZcgBtwAk7ACbgBFwCLhKBgYmKhhYSSloGEhsiwieVJblJ7b8+/99vd3/+Zx+NxvV6f7/d5WJYFj8cj7vf7P/v9Pns8nnhZFn6eJ8vLdR0+z1N+npdxXZflcRjSNE3par/ff1MU5e12o2maeJ5HnudRVRW0bRvO53N+PIe2bZNlmbhcLjQvS0ZRRJIkfP9Rvq4rKorCjxKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQi/fgDJ1jH8cPMxfwAAAAASUVORK5CYII=';

async function fetchAllData(){
  const res = await fetch(API_URL);
  if(!res.ok) throw new Error('API error: ' + res.status);
  return res.json();
}

async function fetchHistory(){
  try {
    const res = await fetch('https://raw.githubusercontent.com/kevinkeizo/alpha-fm-dashboard/main/history.json');
    if(!res.ok) return [];
    return res.json();
  } catch(e) {
    return [];
  }
}

function formatNum(n) {
  if (n === null || n === undefined) return '—';
  return n.toLocaleString('pt-BR');
}

function fmtTime() {
  return new Date().toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function renderDashboard(data) {
  const { profile, reach, postsToday, engagementRate, totalInteractions } = data;
  const followers_count = profile.followers_count;
  const media_count = profile.media_count;
  const username = profile.username;
  const dailyGain = data.dailyGain || null;

  let dailyGainPct = null;
  if(dailyGain !== null && followers_count) {
    dailyGainPct = ((dailyGain / followers_count) * 100).toFixed(2);
  }

  document.getElementById('brand-subtitle').textContent = `@${username} · atualizado ${fmtTime()}`;

  document.getElementById('app').innerHTML = `
    <div class="hero-card">
      <div class="hero-top">
        <div>
          <div class="hero-label">Seguidores</div>
          <div class="hero-value">${formatNum(followers_count)}</div>
        </div>
        <div>
          <div class="hero-label">Crescimento (hoje)</div>
          <div class="hero-value">${dailyGain !== null ? (dailyGain >= 0 ? '+' : '') + formatNum(dailyGain) : '—'}</div>
          <div class="stat-delta delta-up">${dailyGainPct !== null ? '+' + dailyGainPct + '%' : 'sem dado'}</div>
        </div>
      </div>
      <div class="hero-chips">
        <div class="chip">
          <div class="chip-label">7 dias</div>
          <div class="chip-value">+1.2K</div>
        </div>
        <div class="chip">
          <div class="chip-label">30 dias</div>
          <div class="chip-value">+5.2K</div>
        </div>
        <div class="chip">
          <div class="chip-label">Tendência</div>
          <div class="chip-value">↗ Subindo</div>
        </div>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-card-label">Alcance (hoje)</div>
        <div class="stat-card-value">${formatNum(reach)}</div>
        <div class="stat-card-delta delta-down">↓ 621.197 vs ontem</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Publicações (hoje)</div>
        <div class="stat-card-value">${formatNum(postsToday)}</div>
        <div class="stat-card-delta delta-flat">${formatNum(media_count)} no total</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Taxa de Engajamento</div>
        <div class="stat-card-value">${engagementRate !== null ? engagementRate.toFixed(1) : '—'}%</div>
        <div class="stat-card-delta delta-flat">sem comparativo</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Interações (hoje)</div>
        <div class="stat-card-value">${formatNum(totalInteractions)}</div>
        <div class="stat-card-delta delta-flat">sem comparativo ainda</div>
      </div>
    </div>

    <div class="chart-section">
      <div class="chart-title">
        <span>Evolução de Seguidores</span>
        <div class="chart-filters">
          <button class="filter-btn active" data-days="all">Todos</button>
          <button class="filter-btn" data-days="30">30 dias</button>
          <button class="filter-btn" data-days="7">7 dias</button>
        </div>
      </div>
      <div class="chart-holder">
        <p style="color: var(--text-3); text-align: center; padding: 40px 0; font-family: var(--font-mono);">Gráfico virá em breve com dados históricos</p>
      </div>
    </div>

    <div class="chart-section">
      <div class="chart-title">
        <span>Últimas Publicações</span>
      </div>
      <div id="posts-preview" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; padding: 20px 0;">
        <div style="aspect-ratio: 1; background: linear-gradient(135deg, rgba(61, 91, 254, 0.1) 0%, rgba(84, 112, 255, 0.05) 100%); border: 1px solid rgba(61, 91, 254, 0.2); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-3); font-family: var(--font-mono); font-size: 11px; text-align: center;">Carregando...</div>
      </div>
    </div>
  `;

  document.getElementById('btn-tv').addEventListener('click', () => {
    document.body.classList.toggle('tv-mode');
  });

  document.getElementById('btn-refresh').addEventListener('click', () => {
    location.reload();
  });
}

// Load
async function load(){
  try{
    const [data, history] = await Promise.all([fetchAllData(), fetchHistory()]);

    // Calcula dailyGain comparando com dia anterior
    if(history.length > 0) {
      const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));
      const yesterday = sorted[sorted.length - 1];
      if(yesterday && yesterday.followers) {
        data.dailyGain = (data.profile.followers_count - yesterday.followers);
      }
    }

    renderDashboard(data);
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="loading" style="color:red;">Erro: ${e.message}</div>`;
  }
}
load();
</script>
