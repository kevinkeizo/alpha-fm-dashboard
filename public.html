// Troca a seção visível. As views vivem dentro de #app, que é reescrito a
// cada carregamento, então isso roda de novo depois de cada render.

// Anima os números do zero até o valor. Só no primeiro render: rodar isso a
// cada atualização de 5 min viraria distração num telão que fica ligado o dia
// inteiro.
function animarNumeros(raiz){
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  const alvos = raiz.querySelectorAll('.hero-value, .stat-card-value');
  alvos.forEach((el, idx) => {
    const texto = el.textContent.trim();
    // Só anima o que é número puro; '—' e '12,1%' com sinal ficam quietos
    const limpo = texto.replace(/\./g, '').replace(',', '.');
    const alvo = parseFloat(limpo.replace(/[^0-9.-]/g, ''));
    if(!isFinite(alvo) || Math.abs(alvo) < 10) return;

    const prefixo = texto.startsWith('+') ? '+' : '';
    const sufixo = texto.endsWith('%') ? '%' : '';
    const decimais = sufixo === '%' ? 1 : 0;

    const dur = 900, atraso = idx * 45;
    const t0 = performance.now() + atraso;
    el.style.willChange = 'contents';

    function passo(agora){
      const p = Math.min(1, Math.max(0, (agora - t0) / dur));
      // ease-out forte: chega perto do valor rápido e assenta
      const e = 1 - Math.pow(1 - p, 4);
      const v = alvo * e;
      el.textContent = prefixo +
        (decimais ? v.toFixed(1).replace('.', ',') : Math.round(v).toLocaleString('pt-BR')) +
        sufixo;
      if(p < 1) requestAnimationFrame(passo);
      else { el.textContent = texto; el.style.willChange = ''; }
    }
    requestAnimationFrame(passo);
  });
}

function skKpis(n){

function skBarras(n){

  return Array.from({ length: n }, (_, i) => {
    const w = 88 - i * (60 / Math.max(1, n));
    return '<div class="sk-barra">' +
      '<span class="skeleton" style="width:' + (58 + (i % 3) * 12) + '%"></span>' +
      '<span class="skeleton sk-trilho" style="width:' + w.toFixed(0) + '%"></span>' +

}

function skHoras(){

  const alturas = [8,6,5,4,4,5,7,12,26,45,58,52,64,72,88,96,74,68,54,42,36,30,22,14];

// ── Projeção para 1 milhão ──────────────────────────────────────────────────
// Regressão linear sobre a série de seguidores. Uma média simples dos ganhos
// diários também serviria, mas a regressão pesa a série inteira e não se
// desloca por causa de um dia atípico no começo ou no fim.
//
// A faixa não é enfeite: com 19 dias de base, um número único de data seria
// falsa precisão. O desvio dos ganhos diários vira o intervalo.
const META = 1000000;

function projecao(hist){
  const pts = hist
    .filter(h => h.followers != null)
    .map(h => ({ t: Math.round(Date.parse(h.date + 'T12:00:00Z') / 86400000), v: h.followers, d: h.date }))
    .sort((a, b) => a.t - b.t);

  if(pts.length < 4) return null;

  const t0 = pts[0].t;
  const n = pts.length;
  const sx = pts.reduce((a, p) => a + (p.t - t0), 0);
  const sy = pts.reduce((a, p) => a + p.v, 0);
  const sxy = pts.reduce((a, p) => a + (p.t - t0) * p.v, 0);
  const sxx = pts.reduce((a, p) => a + (p.t - t0) ** 2, 0);
  const denom = n * sxx - sx * sx;
  if(!denom) return null;

  const ritmo = (n * sxy - sx * sy) / denom;
  if(ritmo <= 0) return null;   // sem crescimento não há data pra prever

  // Dispersão dos ganhos diários vira a faixa otimista/pessimista
  const ganhos = [];
  for(let i = 1; i < pts.length; i++){
    const dias = pts[i].t - pts[i-1].t;
    if(dias > 0) ganhos.push((pts[i].v - pts[i-1].v) / dias);
  }
  const media = ganhos.reduce((a, g) => a + g, 0) / ganhos.length;
  const desvio = ganhos.length > 1
    ? Math.sqrt(ganhos.reduce((a, g) => a + (g - media) ** 2, 0) / (ganhos.length - 1))
    : 0;
  const ult7 = ganhos.slice(-7);
  const ritmo7 = ult7.length ? ult7.reduce((a, g) => a + g, 0) / ult7.length : ritmo;

  const atual = pts[pts.length - 1].v;
  const falta = META - atual;
  if(falta <= 0) return { atingida: true, atual };

  const dataDe = r => new Date(Date.now() + (falta / r) * 86400000);

  return {
    atingida: false,
    atual,
    falta,
    pct: (atual / META) * 100,
    ritmo,
    ritmo7,
    media,
    desvio,
    dias: Math.ceil(falta / ritmo),
    data: dataDe(ritmo),
    // Faixa: ritmo médio ± um desvio, limitado pra não virar absurdo
    dataOtimista: dataDe(Math.max(media + desvio, ritmo * 1.05)),
    dataPessimista: dataDe(Math.max(1, media - desvio)),
    baseDias: pts.length,
    desde: pts[0].d,
    estimados: hist.filter(h => h.followersEstimado).length
  };
}

// ── Relatório mensal ────────────────────────────────────────────────────────
// Monta a partir do que já está em memória: histórico diário, ranking de
// publicações e demografia. Nenhuma chamada nova — abre na hora.
let _relAudiencia = null;   // preenchido por carregarAudiencia
let _relTop = null;         // preenchido por renderTop


// ── Análise automática ──────────────────────────────────────────────────────
// Cada linha é derivada dos dados e quantificada. Nada de frase genérica:
// se não dá pra afirmar com número, não entra. E onde a amostra é pequena
// demais pra sustentar a conclusão, a linha simplesmente não aparece —
// alguém pode mudar a pauta com base nisso.
function analiseDoMes(hist, posts, proj){
  const L = [];
  const pct = (a, b) => b ? ((a - b) / b) * 100 : 0;
  const comSeg = hist.filter(h => h.followers != null);

  // 1. Crescimento e aceleração
  if(comSeg.length >= 6){
    const ganhos = [];
    for(let i = 1; i < comSeg.length; i++) ganhos.push(comSeg[i].followers - comSeg[i-1].followers);
    const total = comSeg[comSeg.length-1].followers - comSeg[0].followers;
    const medio = ganhos.reduce((a, b) => a + b, 0) / ganhos.length;

    const meio = Math.floor(ganhos.length / 2);
    const p1 = ganhos.slice(0, meio).reduce((a, b) => a + b, 0) / meio;
    const p2 = ganhos.slice(meio).reduce((a, b) => a + b, 0) / (ganhos.length - meio);
    const var2 = pct(p2, p1);

    let txt = 'A base cresceu <b>' + formatNum(total) + '</b> seguidores, média de <b>' +
      formatNum(Math.round(medio)) + ' por dia</b>.';
    // Só chama de aceleração o que sai do ruído
    if(Math.abs(var2) >= 10){
      txt += ' O ritmo ' + (var2 > 0 ? '<b>acelerou ' : '<b>desacelerou ') +
        Math.abs(var2).toFixed(0) + '%</b> na segunda metade do período (' +
        formatNum(Math.round(p1)) + ' → ' + formatNum(Math.round(p2)) + ' por dia).';
    }
    L.push(txt);
  }

  // 2. Formato campeão — só com amostra que sustente
  const fmts = posts.length ? analisaFormatos(posts) : [];
  const solidos = fmts.filter(f => f.qtd >= 5);
  if(solidos.length >= 2){
    const [a, b] = solidos;
    L.push('<b>' + a.nome + '</b> foi o formato mais eficiente: média de <b>' +
      formatNum(a.media) + ' interações</b> por publicação, <b>' +
      pct(a.media, b.media).toFixed(0) + '% acima</b> de ' + b.nome.toLowerCase() +
      ' (' + formatNum(b.media) + '). Foram ' + a.qtd + ' publicações no período.');
  }

  // 3. Melhor horário
  if(posts.length >= 20){
    const h = analisaHoras(posts);
    const geral = posts.reduce((a, p) => a + (p.interactions || 0), 0) / posts.length;
    if(h.max > 0 && geral > 0 && pct(h.max, geral) >= 15){
      L.push('O horário de melhor desempenho foi <b>' + String(h.melhor).padStart(2,'0') +
        'h</b>, com média de <b>' + formatNum(Math.round(h.max)) + ' interações</b> — ' +
        pct(h.max, geral).toFixed(0) + '% acima da média das publicações.');
    }
  }

  // 4. Publicação destaque — vira cartão com link, montado fora daqui
  if(posts.length){
    const top = [...posts].sort((x, y) => (y.interactions ?? -1) - (x.interactions ?? -1))[0];
    const media = posts.reduce((a, p) => a + (p.interactions || 0), 0) / posts.length;
    if(top && top.interactions && media && pct(top.interactions, media) >= 100){
      L.push('A publicação de maior desempenho fez <b>' + formatNum(top.interactions) +
        ' interações</b>, <b>' + (top.interactions / media).toFixed(1).replace('.', ',') +
        'x a média</b> do período.');
      L.destaquePost = top;
    }
  }

  // 5. Conversão em seguidores, onde a API informa
  const comFollows = posts.filter(p => p.follows != null && p.follows > 0);
  if(comFollows.length >= 3){
    const soma = comFollows.reduce((a, p) => a + p.follows, 0);
    const melhor = [...comFollows].sort((a, b) => b.follows - a.follows)[0];
    L.push('Entre imagens e carrosséis — os únicos que o Instagram informa — <b>' +
      formatNum(soma) + ' seguidores</b> vieram de publicação identificada, sendo <b>' +
      melhor.follows + '</b> de uma só, em ' + diaMes(melhor.date) + '.');
  }

  // 6. Projeção
  if(proj && !proj.atingida && proj.dias <= 400){
    L.push('No ritmo atual, a marca de <b>1 milhão</b> deve ser alcançada por volta de <b>' +
      dataLonga(proj.data) + '</b> — faltam ' + formatNum(proj.falta) + ' seguidores.');
  }

  return L;
}


// Cartão da publicação destaque: miniatura, legenda e link. Salvo em PDF o
// link sobrevive, então quem recebe o relatório abre a publicação direto.
function mencaoPost(p){
  if(!p || !p.permalink) return '';
  const tipo = p.isVideo ? 'REEL' : p.media_type === 'CAROUSEL_ALBUM' ? 'CARROSSEL' : 'IMAGEM';
  return '<a class="rel-mencao" href="' + p.permalink + '" target="_blank" rel="noopener">' +
    (p.media_url ? '<img src="' + p.media_url + '" alt="" loading="lazy">' : '<img alt="">') +
    '<div class="rel-mencao-txt">' +
      '<div class="rel-mencao-cap">' + (p.caption || '(sem legenda)') + '</div>' +
      '<div class="rel-mencao-meta">' +
        '<span class="rel-tag">' + tipo + '</span>' +
        '<span>' + diaMes(p.date) + ' · ' + (p.hora || '') + '</span>' +
        '<span class="rel-abrir">abrir no Instagram ↗</span>' +
      '</div>' +
    '</div>' +
    '<div class="rel-mencao-n">' + formatNum(p.interactions) + '<small>interações</small></div>' +
  '</a>';
}

// Gráfico estático para o relatório: sem interação, pensado pro papel
function relGrafico(pontos){
  if(!pontos || pontos.length < 2) return '';
  const w = 700, h = 132, pl = 54, pr = 14, pt = 14, pb = 22;
  const vals = pontos.map(p => p.v);
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const X = i => pl + (i / (pontos.length - 1)) * (w - pl - pr);
  const Y = v => pt + (h - pt - pb) - ((v - min) / span) * (h - pt - pb);

  const linha = pontos.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.v).toFixed(1)).join(' ');
  const area = linha + ' L' + X(pontos.length-1).toFixed(1) + ' ' + (h - pb) + ' L' + pl + ' ' + (h - pb) + ' Z';

  let grade = '', eixo = '';
  for(let i = 0; i <= 2; i++){
    const v = min + span * i / 2, y = Y(v);
    grade += '<line x1="' + pl + '" y1="' + y.toFixed(1) + '" x2="' + (w-pr) + '" y2="' + y.toFixed(1) +
      '" stroke="#E4E7F0" stroke-width="1"/>';
    eixo += '<text x="' + (pl-8) + '" y="' + (y+3.5).toFixed(1) + '" text-anchor="end" font-size="9" ' +
      'font-family="monospace" fill="#A8ACBE">' + compacto(Math.round(v)) + '</text>';
  }

  const passo = Math.max(1, Math.ceil(pontos.length / 7));
  let datas = '';
  pontos.forEach((p, i) => {
    if(i % passo === 0 || i === pontos.length - 1){
      datas += '<text x="' + X(i).toFixed(1) + '" y="' + (h-6) + '" text-anchor="middle" font-size="9" ' +
        'font-family="monospace" fill="#A8ACBE">' + diaMes(p.d) + '</text>';
    }
  });

  return '<div class="rel-gr"><svg viewBox="0 0 ' + w + ' ' + h + '" preserveAspectRatio="none">' +
    '<defs><linearGradient id="relgrad" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="#3D5BFE" stop-opacity="0.16"/>' +
      '<stop offset="100%" stop-color="#3D5BFE" stop-opacity="0"/></linearGradient></defs>' +
    grade +
    '<path d="' + area + '" fill="url(#relgrad)"/>' +
    '<path d="' + linha + '" fill="none" stroke="#3D5BFE" stroke-width="2" ' +
      'stroke-linecap="round" stroke-linejoin="round"/>' +
    eixo + datas +
  '</svg></div>';
}

  '<stop offset="0%" stop-color="#3D5BFE"/><stop offset="100%" stop-color="#2D3F9E"/>' +

function mesesDisponiveis(hist){
  const set = new Set(hist.map(h => h.date.slice(0, 7)));
  return [...set].sort().reverse();
}

function nomeMes(ym){
  const [a, m] = ym.split('-');
  const nomes = ['janeiro','fevereiro','março','abril','maio','junho',
                 'julho','agosto','setembro','outubro','novembro','dezembro'];
  return nomes[+m - 1] + ' de ' + a;
}

function montarRelatorio(ym){
  const hist = (window.__hist || []).filter(h => h.date.slice(0, 7) === ym);
  const corpo = document.getElementById('rel-corpo');
  if(!corpo) return;

  if(!hist.length){
    corpo.innerHTML = '<div class="vazio-msg">Sem dados para este mês</div>';
    return;
  }

  const comSeg = hist.filter(h => h.followers != null);
  const inicio = comSeg[0], fim = comSeg[comSeg.length - 1];
  const ganho = (inicio && fim) ? fim.followers - inicio.followers : null;
  const pctCresc = (ganho != null && inicio.followers) ? (ganho / inicio.followers) * 100 : null;

  const soma = c => hist.reduce((a, h) => a + (h[c] || 0), 0);
  const dias = hist.length;
  const temEstimado = hist.some(h => h.followersEstimado);

  const posts = (_relTop || [])
    .filter(p => p.date && p.date.slice(0, 7) === ym)
    .sort((a, b) => (b.interactions ?? -1) - (a.interactions ?? -1));

  const fmts = posts.length ? analisaFormatos(posts) : [];
  const horas = posts.length ? analisaHoras(posts) : null;
  const proj = projecao(window.__hist || []);

  const num = (v, l, sub, destaque) =>
    '<div class="rel-num' + (destaque ? ' rel-num-ganho' : '') + '">' +
      '<div class="rel-v">' + v + '</div><div class="rel-l">' + l + '</div>' +
      (sub ? '<div class="rel-s">' + sub + '</div>' : '') +
    '</div>';

  let html = '';

  // ── Cabeçalho com a marca ──
  html += '<div class="rel-cab">' + REL_LOGO +
    '<div class="rel-cab-tit">' +
      '<h1>Relatório de Instagram</h1>' +
      '<div class="periodo">Alpha FM 101.7 · ' + nomeMes(ym) + '</div>' +
    '</div>' +
    '<div class="emissao">emitido em ' + new Date().toLocaleDateString('pt-BR') + '<br>' +
      diaMes(hist[0].date) + ' a ' + diaMes(hist[hist.length-1].date) + ' · ' + dias + ' dias</div>' +
  '</div>';

  // ── Destaques: a leitura antes dos números ──
  const analise = analiseDoMes(hist, posts, proj);
  if(analise.length){
    html += '<div class="rel-destaques"><h2>Destaques do período</h2><ul>' +
      analise.map(t => '<li><span>' + t + '</span></li>').join('') +
    '</ul>' + mencaoPost(analise.destaquePost) + '</div>';
  }

  // ── Crescimento ──
  html += '<div class="rel-secao"><h2>Crescimento</h2><div class="rel-grade">' +
    num(fim ? formatNum(fim.followers) : '—', 'Seguidores ao fim', inicio ? 'de ' + formatNum(inicio.followers) : '') +
    num((ganho != null ? (ganho >= 0 ? '+' : '') + formatNum(ganho) : '—'), 'Ganho no período',
      (ganho != null && dias > 1 ? formatNum(Math.round(ganho / (dias - 1))) + ' por dia' : ''), true) +
    num(pctCresc != null ? pctCresc.toFixed(2).replace('.', ',') + '%' : '—', 'Crescimento', 'sobre a base inicial') +
    num(formatNum(soma('posts')), 'Publicações', formatNum(Math.round(soma('posts') / dias)) + ' por dia') +
  '</div>' +
  relGrafico(comSeg.map(h => ({ d: h.date, v: h.followers }))) +
  '</div>';

  // ── Alcance e engajamento ──
  const engs = hist.map(h => h.engagementRate).filter(v => typeof v === 'number');
  const engMedia = engs.length ? engs.reduce((a, b) => a + b, 0) / engs.length : null;

  html += '<div class="rel-secao"><h2>Alcance e engajamento</h2><div class="rel-grade">' +
    num(formatNum(soma('views')), 'Visualizações', formatNum(Math.round(soma('views') / dias)) + ' por dia') +
    num(formatNum(soma('reach')), 'Alcance somado', formatNum(Math.round(soma('reach') / dias)) + ' por dia') +
    num(formatNum(soma('interactions')), 'Interações', formatNum(Math.round(soma('interactions') / dias)) + ' por dia') +
    num(engMedia != null ? engMedia.toFixed(1).replace('.', ',') + '%' : '—', 'Engajamento médio', 'interações por alcance') +
  '</div></div>';

  // ── Melhores publicações ──
  if(posts.length){
    html += '<div class="rel-secao"><h2>Melhores publicações</h2><table class="rel-tabela">' +
      '<tr><th class="pos"></th><th>Publicação</th><th class="num">Interações</th>' +
      '<th class="num">Alcance</th><th class="num">Seguidores</th></tr>' +
      posts.slice(0, 8).map((p, i) =>
        '<tr><td class="num pos">' + (i+1) + '</td>' +
        '<td><div class="rel-post">' +
          (p.media_url ? '<img class="rel-thumb" src="' + p.media_url + '" alt="" loading="lazy">' : '') +
          '<div class="rel-post-txt">' +
            '<div class="cap"><a class="rel-link" href="' + p.permalink + '" target="_blank" rel="noopener">' +
              (p.caption || '(sem legenda)') + '</a></div>' +
            '<div style="margin-top:4px"><span class="rel-tag">' +
              (p.isVideo ? 'REEL' : p.media_type === 'CAROUSEL_ALBUM' ? 'CARROSSEL' : 'IMAGEM') +
            '</span> <span style="font-size:9.5px;color:#A8ACBE;font-family:monospace">' +
              diaMes(p.date) + ' ' + (p.hora || '') + '</span></div>' +
          '</div>' +
        '</div></td>' +
        '<td class="num">' + formatNum(p.interactions) + '</td>' +
        '<td class="num">' + formatNum(p.reach) + '</td>' +
        '<td class="num">' + (p.follows != null ? '+' + p.follows : '—') + '</td></tr>'
      ).join('') +
    '</table></div>';
  }

  // ── Formato, com barra pra comparar de relance ──
  if(fmts.length){
    const teto = Math.max(...fmts.map(f => f.media), 1);
    html += '<div class="rel-secao"><h2>Rendimento por formato</h2><table class="rel-tabela">' +
      '<tr><th>Formato</th><th class="rel-barra-cel"></th><th class="num">Interações (média)</th>' +
      '<th class="num">Alcance (média)</th><th class="num">Publicações</th></tr>' +
      fmts.map(f => '<tr>' +
        '<td><span class="rel-tag">' + f.nome + '</span></td>' +
        '<td class="rel-barra-cel"><div class="rel-barra-tr"><div class="rel-barra-pr" style="width:' +
          ((f.media / teto) * 100).toFixed(1) + '%"></div></div></td>' +
        '<td class="num">' + formatNum(f.media) + '</td>' +
        '<td class="num">' + formatNum(f.alcance) + '</td>' +
        '<td class="num">' + f.qtd + (f.qtd < 5 ? ' ⚠' : '') + '</td></tr>').join('') +
    '</table>' +
    (horas && horas.max > 0
      ? '<div style="margin-top:14px;font-size:11.5px;color:#454B63">Melhor horário do período: <b>' +
        String(horas.melhor).padStart(2,'0') + 'h</b>, com média de ' +
        formatNum(Math.round(horas.max)) + ' interações por publicação.</div>'
      : '') +
    '</div>';
  }

  // ── Audiência ──
  if(_relAudiencia){
    const a = _relAudiencia, tot = a.totais || {};
    const maiorIdade = [...(a.idade||[])].sort((x,y)=>y.valor-x.valor)[0];
    const fem = (a.genero||[]).find(g => g.chave === 'Feminino');
    const cidade1 = (a.cidade||[])[0];
    const br = (a.pais||[]).find(p => p.chave === 'BR');
    html += '<div class="rel-secao"><h2>Perfil da audiência</h2><div class="rel-grade">' +
      num(maiorIdade ? maiorIdade.chave + ' anos' : '—', 'Faixa dominante',
        maiorIdade && tot.idade ? ((maiorIdade.valor/tot.idade)*100).toFixed(0) + '% da base' : '') +
      num(fem && tot.genero ? ((fem.valor/tot.genero)*100).toFixed(0) + '%' : '—', 'Feminino',
        fem ? formatNum(fem.valor) + ' seguidoras' : '') +
      num(cidade1 ? cidade1.chave : '—', 'Maior cidade',
        cidade1 && tot.cidade ? ((cidade1.valor/tot.cidade)*100).toFixed(0) + '% da base' : '') +
      num(br && tot.pais ? ((br.valor/tot.pais)*100).toFixed(0) + '%' : '—', 'No Brasil',
        br ? formatNum(br.valor) + ' seguidores' : '') +
    '</div></div>';
  }

  // ── Projeção ──
  if(proj && !proj.atingida){
    html += '<div class="rel-secao"><h2>Projeção para 1 milhão</h2><div class="rel-proj">' +
      '<div><div class="rel-proj-data">' + dataLonga(proj.data) + '</div>' +
      '<div style="font-size:10.5px;color:#7B8098;font-family:monospace;margin-top:3px">' +
        'entre ' + dataCurta(proj.dataOtimista) + ' e ' + dataCurta(proj.dataPessimista) +
        ' · ' + proj.dias + ' dias</div></div>' +
      '<div class="rel-proj-tr"><div class="rel-proj-pr" style="width:' + proj.pct.toFixed(2) + '%"></div></div>' +
      '<div style="font-family:monospace;font-size:12px;white-space:nowrap">' +
        proj.pct.toFixed(1).replace('.', ',') + '%</div>' +
    '</div></div>';
  }

  // ── Ressalvas ──
  const notas = [];
  notas.push('Período coberto: ' + diaMes(hist[0].date) + ' a ' + diaMes(hist[hist.length-1].date) + ' (' + dias + ' dias).');
  if(temEstimado) notas.push('Alguns dias têm a contagem de seguidores estimada por interpolação, quando a captura automática atrasou.');
  if(posts.length) notas.push('O ranking cobre as publicações de melhor desempenho de cada dia, não todas as do período.');
  if(fmts.some(f => f.qtd < 5)) notas.push('Formatos marcados com ⚠ têm menos de 5 publicações; a média deles ainda oscila muito.');
  notas.push('Alcance somado repete quem viu em mais de um dia — não é público único do período.');
  notas.push('O Instagram não informa seguidores ganhos em reels; a coluna aparece apenas para imagens e carrosséis.');
  if(_relAudiencia) notas.push('O perfil da audiência é o retrato atual da base, não do período.');
  if(proj) notas.push('A projeção é uma regressão linear sobre ' + proj.baseDias + ' dias e assume que o ritmo se mantém.');
  html += '<div class="rel-rodape">' + notas.map(n => '· ' + n).join('<br>') + '</div>';

  corpo.innerHTML = html;
}


// O relatório depende de duas fontes que chegam depois do painel: o ranking
// de publicações (/api/top faz uma chamada por post, é o mais lento) e a
// demografia. Abrir antes delas montava um relatório mudo — sem publicações,
// sem formatos, e com a análise reduzida a duas linhas.
//
// Em vez de confiar que já carregou, busca o que faltar.
async function garantirDadosRelatorio(){
  const pendentes = [];

  if(!_relTop || !_relTop.length){
    pendentes.push(
      Promise.all([fetchTopHoje(), fetchTopGuardado()]).then(([hoje, guardado]) => {
        const porId = new Map();
        [...(guardado.recentes || []), ...(guardado.allTime || []), ...(hoje || [])]
          .forEach(p => { if(p && p.id) porId.set(p.id, p); });
        _relTop = [...porId.values()];
      })
    );
  }

  if(!_relAudiencia){
    pendentes.push(
      fetch(comToken(API_URL.replace('/api/data', '/api/audience')))
        .then(r => r.ok ? r.json() : null)
        .then(a => { if(a && !a.error) _relAudiencia = a; })
    );
  }

  // Uma fonte que falha não pode impedir o resto do relatório de sair
  if(pendentes.length) await Promise.all(pendentes.map(p => p.catch(() => {})));
}

async function abrirRelatorio(){
  const fundo = document.getElementById('rel-fundo');
  const sel = document.getElementById('rel-mes');
  if(!fundo || !sel) return;

  const meses = mesesDisponiveis(window.__hist || []);
  if(!meses.length){
    alert('Ainda não há histórico para gerar relatório.');
    return;
  }

  sel.innerHTML = meses.map(m => '<option value="' + m + '">' + nomeMes(m) + '</option>').join('');
  sel.onchange = () => montarRelatorio(sel.value);

  // Abre já, com esqueleto: esperar de tela branca parece travado
  fundo.hidden = false;
  document.body.style.overflow = 'hidden';

  const corpo = document.getElementById('rel-corpo');
  if(corpo && (!_relTop || !_relTop.length)){
    corpo.innerHTML =
      '<div class="skeleton" style="height:62px;border-radius:10px;margin-bottom:26px"></div>' +
      '<div class="skeleton" style="height:118px;border-radius:12px;margin-bottom:26px"></div>' +
      '<div class="rel-grade" style="margin-bottom:22px">' + skKpis(4) + '</div>' +
      '<div class="skeleton" style="height:132px;border-radius:10px;margin-bottom:26px"></div>' +
      '<div class="rel-grade">' + skKpis(4) + '</div>';
  }

  await garantirDadosRelatorio();
  montarRelatorio(sel.value);
}

function fecharRelatorio(){
  const fundo = document.getElementById('rel-fundo');
  if(fundo) fundo.hidden = true;
  document.body.style.overflow = '';
}

function ligarRelatorio(){
  const f = document.getElementById('rel-fechar');
  const i = document.getElementById('rel-imprimir');
  const fundo = document.getElementById('rel-fundo');
  if(f) f.onclick = fecharRelatorio;
  if(i) i.onclick = () => window.print();
  // Clicar fora fecha; Esc também
  if(fundo) fundo.onclick = ev => { if(ev.target === fundo) fecharRelatorio(); };
  document.addEventListener('keydown', ev => {
    if(ev.key === 'Escape' && fundo && !fundo.hidden) fecharRelatorio();
  });
}

// Barras proporcionais reusando o componente de formato: mesma linguagem
// visual em todo o painel, e quem já leu uma sabe ler a outra.
function barrasDe(itens, total, opts){
  const o = opts || {};
  if(!itens || !itens.length) return '<div class="vazio-msg">Sem dados</div>';
  const teto = Math.max(...itens.map(i => i.valor), 1);
  return itens.map(i => {
    const pct = total ? (i.valor / total) * 100 : 0;
    return '<div class="fmt-linha">' +
      '<span class="fmt-nome" title="' + i.chave + (i.uf ? ', ' + i.uf : '') + '">' +
        i.chave + (i.uf ? ' <span class="fmt-uf">' + i.uf + '</span>' : '') +
      '</span>' +
      '<div class="fmt-barra"><div class="fmt-preenche" style="width:' +
        ((i.valor / teto) * 100).toFixed(1) + '%;' + (o.cor ? 'background:' + o.cor : '') + '"></div></div>' +
      '<span class="fmt-num">' + formatNum(i.valor) +
        '<small>' + pct.toFixed(1).replace('.', ',') + '% da base</small></span>' +
    '</div>';
  }).join('');
}

function renderTop(hoje, guardado){
  const lista = document.getElementById('top-lista');
  if(!lista) return;

  // O arquivo só tem dias fechados, então o de hoje entra sempre pelo ao vivo.
  function semRepetir(listas){
    const porId = new Map();
    listas.flat().forEach(p => { if(p && p.id) porId.set(p.id, p); });
    return [...porId.values()];
  }

  const porInteracoes = (a, b) => (b.interactions ?? -1) - (a.interactions ?? -1);

  // UNIVERSO: tudo que existe no período. Base dos agregados — total de
  // publicações, médias por formato, distribuição por horário. Precisa ser
  // representativo, então nunca sai do hall da fama.
  function universo(periodo){
    if(periodo === 'hoje') return hoje.slice();
    const corte = new Date(Date.now() - Number(periodo) * 86400000).toISOString().slice(0, 10);
    return semRepetir([guardado.recentes.filter(p => p.date >= corte), hoje]);
  }

  // RANKING: as melhores. Em "Sempre" o hall da fama entra, porque guarda
  // recordes que já saíram da janela de 35 dias do arquivo.
  function paraRanking(periodo){
    if(periodo === 'hoje') return hoje.slice().sort(porInteracoes);
    return universo(periodo).sort(porInteracoes);
  }

  // Top 3 de hoje na Visão Geral
  const dEl = document.getElementById('destaques');
  if(dEl){
    const tres = hoje.slice(0, 3);
    const sub = document.getElementById('destaques-sub');
    if(sub) sub.textContent = hoje.length ? hoje.length + ' publicações' : '';
    dEl.innerHTML = tres.length ? tres.map(p =>
      '<a class="destaque" href="' + p.permalink + '" target="_blank" rel="noopener">' +
        '<span class="destaque-thumb">' + (p.media_url ? '<img src="' + p.media_url + '" loading="lazy" alt="">' : '') + '</span>' +
        '<span class="destaque-meta">' +
          '<span class="destaque-cap">' + (p.caption || '(sem legenda)') + '</span>' +
          '<span class="destaque-sub">' +
            '<span class="rank-tag ' + (p.isVideo ? 'reel' : '') + '">' +
              (p.isVideo ? 'REEL' : p.media_type === 'CAROUSEL_ALBUM' ? 'CARROSSEL' : 'IMAGEM') +
            '</span>' +
            '<span>' + (p.hora || '') + '</span>' +
          '</span>' +
        '</span>' +
        '<span class="destaque-num">' + formatNum(p.interactions) + '<small>interações</small></span>' +
      '</a>'
    ).join('') : '<div class="vazio-msg">Nenhuma publicação hoje ainda</div>';
  }

  _relTop = semRepetir([guardado.recentes, guardado.allTime, hoje]);
  // Se o relatório estiver aberto esperando, completa sozinho
  const relAberto = document.getElementById('rel-fundo');
  const relMes = document.getElementById('rel-mes');
  if(relAberto && !relAberto.hidden && relMes && relMes.value) montarRelatorio(relMes.value);

  const badge = document.getElementById('badge-insights');
  if(badge) badge.textContent = hoje.length ? hoje.length : '';

  function desenhar(periodo){
    const todos = universo(periodo);          // agregados
    const posts = paraRanking(periodo).slice(0, 20); // lista

    // ── Cobertura real do período pedido ──
    const cob = document.getElementById('ins-cobertura');
    if(cob){
      const datas = todos.map(p => p.date).filter(Boolean).sort();
      if(!datas.length){
        cob.textContent = '';
        cob.className = 'cobertura';
      }else{
        const de = datas[0], ate = datas[datas.length - 1];
        const dias = Math.round((new Date(ate) - new Date(de)) / 86400000) + 1;
        const pedido = periodo === 'hoje' ? 1 : Number(periodo);
        // Só avisa quando o histórico é mais curto que o filtro pedido
        const curto = pedido && dias < pedido - 1;
        cob.className = 'cobertura' + (curto ? ' parcial' : '');
        cob.textContent = periodo === 'hoje'
          ? diaMes(ate) + ' · ' + todos.length + ' publicações'
          : (curto
              ? 'histórico começa em ' + diaMes(de) + ' — ' + dias + ' dias disponíveis dos ' + pedido + ' pedidos'
              : diaMes(de) + ' a ' + diaMes(ate) + ' · ' + dias + ' dias');
      }
    }

    // ── Faixa de KPIs: os números que respondem sozinhos ──
    const strip = document.getElementById('ins-strip');
    if(strip){
      const inter = todos.reduce((a, p) => a + (p.interactions || 0), 0);
      const alc = todos.reduce((a, p) => a + (p.reach || 0), 0);
      const seg = todos.reduce((a, p) => a + (p.follows || 0), 0);
      const temSeg = todos.some(p => p.follows != null);
      const melhor = todos[0];
      const fmts = analisaFormatos(todos);
      const campeao = fmts[0];

      strip.classList.add('chegou');
      strip.innerHTML = [
        kpiSimples('Publicações', formatNum(todos.length), (todos.filter(p => p.isVideo).length) + ' reels'),
        kpiSimples('Interações', formatNum(inter), todos.length ? 'média ' + formatNum(Math.round(inter / todos.length)) : '—'),
        kpiSimples('Alcance somado', formatNum(alc), todos.length ? 'média ' + formatNum(Math.round(alc / todos.length)) : '—'),
        campeao
          ? kpiSimples('Formato campeão', campeao.nome, formatNum(campeao.media) + ' por publicação', true)
          : kpiSimples('Formato campeão', '—', ''),
        temSeg
          ? kpiSimples('Seguidores ganhos', '+' + formatNum(seg), 'só imagens e carrosséis', false, true)
          : ''
      ].join('');
    }

    // ── Formatos: barra proporcional, o tamanho relativo se lê sem comparar ──
    const fmtEl = document.getElementById('ins-formatos');
    if(fmtEl){
      const fmts = analisaFormatos(todos);
      const teto = Math.max(...fmts.map(f => f.media), 1);
      fmtEl.classList.add('chegou');
      fmtEl.innerHTML = fmts.length ? fmts.map(f => {
        const classe = f.nome.toLowerCase();
        // Com menos de 3 publicações a média vira ruído: um post fora da curva
        // inverte o ranking. Melhor marcar do que deixar decidir pauta em cima disso.
        const fraco = f.qtd < 3;
        return '<div class="fmt-linha">' +
          '<span class="fmt-nome">' + f.nome + '</span>' +
          '<div class="fmt-barra"><div class="fmt-preenche ' + classe + (fraco ? ' fraca' : '') +
            '" style="width:' + ((f.media / teto) * 100).toFixed(1) + '%"></div></div>' +
          '<span class="fmt-num">' + formatNum(f.media) +
            '<small>' + (fraco ? '⚠ só ' : 'em ') + f.qtd + ' publicaç' + (f.qtd === 1 ? 'ão' : 'ões') + '</small>' +
          '</span>' +
        '</div>';
      }).join('') : '<div class="vazio-msg">Sem dados no período</div>';
    }

    // ── Horas: 24 colunas, o pico em âmbar ──
    const hEl = document.getElementById('ins-horas');
    const hEixo = document.getElementById('ins-horas-eixo');
    if(hEl){
      const { medias, max, melhor } = analisaHoras(todos);
      hEl.classList.remove('sk-horas');
      hEl.classList.add('chegou');
      hEl.innerHTML = medias.map((m, h) =>
        '<div class="hora-col' + (h === melhor && max > 0 ? ' pico' : '') + '" style="height:' +
        Math.max(3, (m / max) * 100).toFixed(1) + '%" title="' + String(h).padStart(2, '0') + 'h · ' +
        formatNum(Math.round(m)) + ' interações em média"></div>'
      ).join('');
      if(hEixo) hEixo.innerHTML = medias.map((_, h) => '<span>' + (h % 3 === 0 ? String(h).padStart(2, '0') : '') + '</span>').join('');
      const pico = document.getElementById('ins-pico');
      if(pico) pico.textContent = max > 0 ? 'pico às ' + String(melhor).padStart(2, '0') + 'h' : '';
    }

    // ── Nota do ranking: curta, e só quando há o que ressalvar ──
    const nota = document.getElementById('top-nota');
    if(nota) nota.textContent = posts.some(p => p.follows != null)
      ? 'por interações · reels não reportam seguidores'
      : 'por interações';

    if(posts.length === 0){
      lista.innerHTML = '<div class="vazio-msg">' + (periodo === 'hoje'
        ? 'Nenhuma publicação hoje ainda'
        : 'Sem dados nesse período — o histórico enche a cada noite') + '</div>';
      return;
    }

    const teto = Math.max(...posts.map(p => p.interactions || 0), 1);
    lista.innerHTML = posts.map((p, i) => `
      <a class="rank-linha" href="${p.permalink}" target="_blank" rel="noopener"
         style="--peso: ${(((p.interactions || 0) / teto) * 100).toFixed(1)}%">
        <span class="rank-pos">${i + 1}</span>
        <span class="rank-thumb">${p.media_url ? `<img src="${p.media_url}" loading="lazy" alt="">` : ''}</span>
        <span class="rank-meta">
          <span class="rank-cap">${p.caption || '(sem legenda)'}</span>
          <span class="rank-sub">
            <span class="rank-tag ${p.isVideo ? 'reel' : ''}">${p.isVideo ? 'REEL' : p.media_type === 'CAROUSEL_ALBUM' ? 'CARROSSEL' : 'IMAGEM'}</span>
            <span>${diaMes(p.date)} ${p.hora || ''}</span>
          </span>
        </span>
        <span class="rank-num"><span class="rank-num-v">${formatNum(p.interactions)}</span><span class="rank-num-l">interações</span></span>
        <span class="rank-num esconde"><span class="rank-num-v">${formatNum(p.reach)}</span><span class="rank-num-l">alcance</span></span>
        <span class="rank-num esconde"><span class="rank-num-v ${p.follows ? 'ganho' : 'vazio'}">${p.follows != null ? '+' + p.follows : '—'}</span><span class="rank-num-l">seguidores</span></span>
      </a>
    `).join('');
  }

  document.querySelectorAll('.top-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      desenhar(btn.dataset.periodo);
    });
  });

  desenhar('hoje');
}

// Avisa com folga: 15 dias pra alguém se organizar, 5 pra ser inadiável.
// Quando o token vencer eu provavelmente não vou estar por perto — então o
// aviso precisa dizer o que fazer, não só que algo vai quebrar.
function avisarToken(ts){
  if(!ts) return false;
  const d = ts.daysUntilExpiry;
  if(ts.isExpired){
    mostrarFaixa('critico',
      '<b>O acesso ao Instagram expirou.</b> Os números pararam de atualizar. ' +
      'É preciso gerar um novo token no Meta for Developers e atualizar a variável IG_TOKEN na Vercel.',
      'venceu em ' + ts.expiryDate);
    return true;
  }
  if(d <= 5){
    mostrarFaixa('critico',
      '<b>O acesso ao Instagram vence em ' + d + (d === 1 ? ' dia' : ' dias') + '.</b> ' +
      'Quando vencer, o dashboard para de atualizar. Renove o token no Meta for Developers.',
      'vence em ' + ts.expiryDate);
    return true;
  }
  if(d <= 15){
    mostrarFaixa('atencao',
      '<b>O acesso ao Instagram vence em ' + d + ' dias</b> (' + ts.expiryDate + '). ' +
      'Vale renovar antes que pare.',
      'IG_TOKEN · Vercel');
    return true;
  }
  return false;
}

// ── Último estado bom ───────────────────────────────────────────────────────
// Um blip de rede de 3 segundos derrubava a tela inteira pra um texto vermelho
// — no telão da redação. Guardar o último retrato bom deixa o painel de pé.
const GUARDA = 'alpha-ultimo';

function guardarEstado(data){
  try{
    localStorage.setItem(GUARDA, JSON.stringify({ quando: Date.now(), data }));
  }catch(e){}
}

function lerEstado(){
  try{
    const cru = localStorage.getItem(GUARDA);
    if(!cru) return null;
    const o = JSON.parse(cru);
    // Mais de 12h é retrato de outro dia: melhor não fingir que é de agora
    if(Date.now() - o.quando > 12 * 3600000) return null;
    return o;
  }catch(e){ return null; }
}

function minutosDesde(ms){
  return Math.max(1, Math.round((Date.now() - ms) / 60000));
}


// ── Portão de acesso ────────────────────────────────────────────────────────
// A validação é no servidor: a senha nunca chega ao navegador e os endpoints
// recusam quem não traz token. Uma tela de login só no HTML seria enfeite —
// o repositório é público e a senha apareceria no código-fonte.
const CHAVE_TOKEN = 'alpha-token';

function tokenSalvo(){
  try{ return localStorage.getItem(CHAVE_TOKEN) || ''; }catch(e){ return ''; }
}

function guardarToken(t){
  try{ t ? localStorage.setItem(CHAVE_TOKEN, t) : localStorage.removeItem(CHAVE_TOKEN); }catch(e){}
}

// Anexa o token a qualquer chamada da API
function comToken(url){
  const t = tokenSalvo();
  if(!t) return url;
  return url + (url.indexOf('?') >= 0 ? '&' : '?') + 't=' + encodeURIComponent(t);
}

function sair(){
  guardarToken('');
  location.reload();
}

function abrirPortao(){
  const p = document.getElementById('portao');
  if(p) p.hidden = true;
}

// Verifica com o servidor se o login está ligado e se o token guardado vale.
// Devolve true quando pode seguir direto pro painel.
async function verificarAcesso(){
  try{
    const r = await fetch(API_URL.replace('/api/data', '/api/login') + '?t=' + encodeURIComponent(tokenSalvo()));
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    if(!j.ativo){
      // Login não configurado na Vercel: painel aberto, e o botão Sair some
      document.body.classList.add('sem-login');
      return true;
    }
    return !!j.valido;
  }catch(e){
    // Sem resposta do servidor não dá pra afirmar que o token vale
    return false;
  }
}

function ligarPortao(){
  const form = document.getElementById('portao-form');
  if(!form) return;
  const btn = document.getElementById('portao-btn');
  const erro = document.getElementById('portao-erro');
  const caixa = document.querySelector('.portao-caixa');

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    erro.classList.remove('visivel');
    btn.disabled = true;
    btn.textContent = 'Entrando…';

    try{
      const r = await fetch(API_URL.replace('/api/data', '/api/login'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          usuario: document.getElementById('usuario').value,
          senha: document.getElementById('senha').value
        })
      });
      const j = await r.json();

      if(j.ok){
        if(j.token) guardarToken(j.token);
        if(j.semLogin) document.body.classList.add('sem-login');
        abrirPortao();
        load();
        return;
      }

      erro.textContent = j.error || 'Não foi possível entrar';
      erro.classList.add('visivel');
      caixa.classList.remove('errou');
      void caixa.offsetWidth;   // reinicia a animação
      caixa.classList.add('errou');
      document.getElementById('senha').select();
    }catch(e){
      erro.textContent = 'Sem conexão com o servidor';
      erro.classList.add('visivel');
    }finally{
      btn.disabled = false;
      btn.textContent = 'Entrar';
    }
  });

  document.getElementById('usuario').focus();
}

// Ponto de entrada: só carrega o painel depois de passar pelo portão
async function iniciar(){
  ligarPortao();
  ligarRelatorio();
  if(await verificarAcesso()){
    abrirPortao();
    load();
  }
}

// ── Pulso ao vivo ───────────────────────────────────────────────────────────
// Num telão que fica ligado o dia inteiro, número parado parece tela travada.
// A cada minuto relê a API e, quando um valor muda de fato, ele sobe (ou
// desce) até o novo em vez de trocar seco.
//
// Só anima o que mudou: a API tem cache de 5 min, então quatro em cada cinco
// leituras vêm iguais. Animar tudo toda vez viraria ruído — e a régua do Emil
// é clara: se o usuário vê muitas vezes por dia, ou tem propósito ou não anima.
// O propósito aqui é indicar estado: mostrar que o dado está vivo.
(function pulsoAoVivo(){
  const INTERVALO = 60000;
  let anterior = {};
  let parado = false;

  function formata(v, fmt){
    if(v == null) return '—';
    if(fmt === 'pct')  return v.toFixed(1) + '%';
    if(fmt === 'dec2') return v.toFixed(2).replace('.', ',');
    if(fmt === 'sinal') return (v >= 0 ? '+' : '') + Math.round(v).toLocaleString('pt-BR');
    return Math.round(v).toLocaleString('pt-BR');
  }

  function anima(el, de, para, fmt){
    const dur = 800;
    const t0 = performance.now();
    el.classList.add('subindo');
    function passo(agora){
      const p = Math.min(1, (agora - t0) / dur);
      const e = 1 - Math.pow(1 - p, 4);       // ease-out forte
      el.textContent = formata(de + (para - de) * e, fmt);
      if(p < 1) requestAnimationFrame(passo);
      else{
        el.textContent = formata(para, fmt);
        setTimeout(() => el.classList.remove('subindo'), 700);
      }
    }
    requestAnimationFrame(passo);
  }

  function aplica(valores){
    Object.entries(valores).forEach(([chave, novo]) => {
      if(novo == null) return;
      const el = document.querySelector('[data-metrica="' + chave + '"]');
      if(!el) return;
      const velho = anterior[chave];
      if(velho == null || velho === novo){
        if(velho == null) el.textContent = formata(novo, el.dataset.fmt);
        anterior[chave] = novo;
        return;
      }
      // Direção da seta: pra cima em alta, pra baixo em queda
      el.classList.toggle('caindo', novo < velho);
      anima(el, velho, novo, el.dataset.fmt);
      anterior[chave] = novo;
    });
  }

  async function tick(){
    if(parado || document.hidden) return;
    try{
      const d = await fetchAllData();
      const hist = window.__hist || [];
      const ultimo = hist.length ? hist[hist.length - 1] : null;
      aplica({
        followers: d.profile && d.profile.followers_count,
        dailyGain: (ultimo && ultimo.followers && d.profile)
          ? d.profile.followers_count - ultimo.followers : null,
        views: d.views,
        reach: d.reach,
        interactions: d.totalInteractions,
        engagement: d.engagementRate,
        posts: d.postsToday,
        reelViews: d.reelViews,
        vps: (d.views && d.profile && d.profile.followers_count)
          ? d.views / d.profile.followers_count : null
      });
      // Chips junto: o ritmo esperado muda a cada minuto que passa do dia
      const m7 = c => mediaDe(hist, c, 7);
      const novosChips = {
        views:        chipRitmo(d.views, m7('views'), 'views'),
        reach:        chipRitmo(d.reach, m7('reach'), 'reach'),
        interactions: chipRitmo(d.totalInteractions, m7('interactions'), 'interactions'),
        posts:        chipRitmo(d.postsToday, m7('posts'), 'posts'),
        reelViews:    chipRitmo(d.reelViews, m7('reelViews'), 'reelViews'),
        engagement:   chipDelta(d.engagementRate, m7('engagementRate'), { chave: 'engagement' })
      };
      Object.entries(novosChips).forEach(([k, html]) => {
        const alvo = document.querySelector('[data-chip="' + k + '"]');
        if(alvo) alvo.outerHTML = html;
      });

      const sub = document.getElementById('brand-subtitle');
      if(sub && d.profile) sub.textContent = '@' + d.profile.username + ' · atualizado ' + fmtTime();
      // Voltou a responder: tira a marca de dado velho
      if(document.body.classList.contains('dado-velho')){
        document.body.classList.remove('dado-velho');
        mostrarFaixa(null);
        avisarToken(d.tokenStatus);
      }
      guardarEstado({ data: d, history: window.__hist || [] });
    }catch(e){
      // Uma falha isolada não derruba o laço, mas marca a tela
      document.body.classList.add('dado-velho');
      mostrarFaixa('atencao', '<b>Reconectando ao Instagram.</b> Os números abaixo são os últimos recebidos.', 'nova tentativa em 1 min');
    }
  }

  // Semeia com o que já está na tela pra primeira leitura não animar do zero
  window.__semearPulso = function(valores){ anterior = Object.assign({}, valores); };

  setInterval(tick, INTERVALO);
  // Aba oculta não precisa consultar a API; ao voltar, atualiza na hora
  document.addEventListener('visibilitychange', () => { if(!document.hidden) tick(); });
})();

// Modo TV: liga, desliga por botão ou Esc, e esconde o botão quando o mouse
// para de se mexer — num telão ninguém quer chrome permanente na tela.
(function modoTV(){
  let ocioso;

  function acorda(){
    if(!document.body.classList.contains('tv-mode')) return;
    document.body.classList.add('tv-ativo');
    clearTimeout(ocioso);
    ocioso = setTimeout(() => document.body.classList.remove('tv-ativo'), 2600);
  }

  function sair(){
    document.body.classList.remove('tv-mode', 'tv-ativo');
    clearTimeout(ocioso);
    try{ localStorage.setItem('alpha-tv', '0'); }catch(e){}
  }

  function entrar(){
    document.body.classList.add('tv-mode');
    acorda();
    try{ localStorage.setItem('alpha-tv', '1'); }catch(e){}
  }

  window.alphaTV = { entrar, sair, alternar(){
    document.body.classList.contains('tv-mode') ? sair() : entrar();
  }};

  const btn = document.getElementById('btn-sair-tv');
  if(btn) btn.onclick = sair;

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && document.body.classList.contains('tv-mode')) sair();
  });

  ['mousemove', 'pointerdown', 'keydown'].forEach(ev =>
    document.addEventListener(ev, acorda, { passive: true }));

  // Retoma o modo TV depois de um reload: o telão pode reiniciar sozinho
  try{ if(localStorage.getItem('alpha-tv') === '1') entrar(); }catch(e){}
})();

iniciar();
</script>
