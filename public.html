<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha FM · Instagram Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --primary: #3D5BFE;
  --primary-dark: #2D3F9E;
  --primary-light: #5470FF;
  --bg: #F8F9FC;
  --surface: #FFFFFF;
  --surface-light: #F3F4FA;
  --text-1: #0F1419;
  --text-2: #5C5F73;
  --text-3: #8B8D9A;
  --success: #10B981;
  --danger: #EF4444;
  --accent: #FF6B35;
  --font-display: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: linear-gradient(135deg, var(--bg) 0%, #EFF0F7 100%);
  color: var(--text-1);
  font-family: var(--font-display);
  position: relative;
  animation: gradientShift 15s ease-in-out infinite;
}

@keyframes gradientShift {
  0%, 100% {
    background: linear-gradient(135deg, var(--bg) 0%, #EFF0F7 100%);
  }
  50% {
    background: linear-gradient(135deg, #F0F2FA 0%, #E8EAFC 100%);
  }
}

#canvas-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  opacity: 0.15;
  animation: floatBg 20s ease-in-out infinite;
}

@keyframes floatBg {
  0%, 100% { transform: translateY(0px); }
  50% { transform: translateY(20px); }
}

.wrap {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 24px 40px;
  gap: 16px;
  border-bottom: 1px solid rgba(61, 91, 254, 0.08);
  backdrop-filter: blur(20px);
  background: rgba(248, 249, 252, 0.6);
  position: sticky;
  top: 0;
  z-index: 100;
}

.brand {
  display: flex;
  align-items: center;
  gap: 12px;
}

.brand-logo {
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  filter: drop-shadow(0 4px 12px rgba(61, 91, 254, 0.2));
  transition: transform 0.3s ease;
}

.brand-logo:hover {
  transform: scale(1.05);
}

.brand-text h1 {
  font-size: 18px;
  font-weight: 800;
  letter-spacing: -0.01em;
  color: var(--text-1);
}

.brand-text p {
  font-size: 12px;
  color: var(--text-2);
  font-family: var(--font-mono);
  margin-top: 2px;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.status-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  background: rgba(16, 185, 129, 0.1);
  border: 1px solid rgba(16, 185, 129, 0.3);
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  color: var(--success);
  font-family: var(--font-mono);
}

.live-dot {
  width: 6px;
  height: 6px;
  background: var(--success);
  border-radius: 50%;
  animation: pulse 1.5s ease-in-out infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.2s ease;
}

.icon-btn:hover {
  background: rgba(61, 91, 254, 0.1);
  border-color: var(--primary);
  color: var(--primary);
}

.icon-btn svg {
  width: 16px;
  height: 16px;
}

/* Main content */
.container {
  padding: 40px;
  max-width: 1400px;
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

/* Hero Card - MEGA */
.hero-card {
  background: linear-gradient(135deg, rgba(61, 91, 254, 0.08) 0%, rgba(84, 112, 255, 0.04) 100%);
  border: 1px solid rgba(61, 91, 254, 0.2);
  border-radius: 24px;
  padding: 48px;
  margin-bottom: 40px;
  backdrop-filter: blur(20px);
  box-shadow: 0 20px 60px rgba(61, 91, 254, 0.15);
  animation: fadeUp 0.8s ease-out;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hero-top {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 40px;
  margin-bottom: 0;
  align-items: stretch;
}

@media (max-width: 900px) {
  .hero-top {
    grid-template-columns: 1fr;
    gap: 32px;
  }
}

/* Total Seguidores */
.hero-top > div:first-child {
  display: flex;
  flex-direction: column;
  gap: 20px;
  justify-content: flex-start;
}

.hero-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--text-2);
}

.hero-value {
  font-size: 72px;
  font-weight: 900;
  font-family: var(--font-mono);
  background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 0.9;
  letter-spacing: -0.03em;
}

/* Ganho Diário - BOX DESTAQUE */
.hero-top > div:last-child {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 32px;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.12) 0%, rgba(34, 197, 94, 0.06) 100%);
  border: 2px solid rgba(16, 185, 129, 0.4);
  border-radius: 16px;
  backdrop-filter: blur(10px);
}

.hero-top > div:last-child .hero-label {
  color: var(--success);
  font-size: 11px;
}

.hero-top > div:last-child .hero-value {
  background: linear-gradient(135deg, var(--success) 0%, #10B981 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  font-size: 52px;
}

.hero-top > div:last-child .stat-delta {
  font-size: 13px;
  font-weight: 700;
  color: var(--success);
  background: transparent;
  padding: 0;
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 8px;
}

/* Comparativos */
.hero-chips {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  padding-top: 16px;
  border-top: 1px solid rgba(61, 91, 254, 0.15);
}

.chip {
  display: flex;
  flex-direction: column;
  gap: 3px;
  padding: 10px 12px;
  background: rgba(61, 91, 254, 0.08);
  border-radius: 8px;
  border: 1px solid rgba(61, 91, 254, 0.15);
}

.chip-label {
  font-size: 10px;
  color: var(--text-3);
  text-transform: uppercase;
  letter-spacing: 0.4px;
  font-weight: 600;
}

.chip-value {
  font-size: 14px;
  font-weight: 800;
  font-family: var(--font-mono);
  color: var(--primary-light);
}

/* Stat Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  margin-bottom: 40px;
}

@media (max-width: 1200px) {
  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 16px;
  }
}

@media (max-width: 600px) {
  .stats-grid {
    grid-template-columns: 1fr;
  }
}

.stat-card {
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0.02) 100%);
  border: 1px solid rgba(61, 91, 254, 0.2);
  border-radius: 16px;
  padding: 28px;
  backdrop-filter: blur(10px);
  transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  animation: fadeUp 0.8s ease-out;
  animation-fill-mode: both;
}

.stat-card:nth-child(1) { animation-delay: 0.1s; }
.stat-card:nth-child(2) { animation-delay: 0.2s; }
.stat-card:nth-child(3) { animation-delay: 0.3s; }
.stat-card:nth-child(4) { animation-delay: 0.4s; }

.stat-card:hover {
  background: linear-gradient(135deg, rgba(61, 91, 254, 0.12) 0%, rgba(84, 112, 255, 0.06) 100%);
  border-color: var(--primary);
  transform: translateY(-8px);
  box-shadow: 0 20px 50px rgba(61, 91, 254, 0.2);
}

.stat-card-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text-2);
  margin-bottom: 12px;
}

.stat-card-value {
  font-size: 36px;
  font-weight: 900;
  font-family: var(--font-mono);
  color: var(--primary-light);
  line-height: 1;
  margin-bottom: 12px;
  letter-spacing: -0.02em;
}

.stat-card-delta {
  font-size: 12px;
  font-family: var(--font-mono);
  font-weight: 600;
  padding: 0;
  background: transparent;
}

.delta-up {
  color: var(--success);
}

.delta-down {
  color: var(--danger);
}

.delta-flat {
  color: var(--text-3);
}

/* Charts */
.chart-section {
  background: linear-gradient(135deg, rgba(61, 91, 254, 0.08) 0%, rgba(84, 112, 255, 0.04) 100%);
  border: 1px solid rgba(61, 91, 254, 0.2);
  border-radius: 20px;
  padding: 32px;
  margin-bottom: 30px;
  backdrop-filter: blur(20px);
  animation: fadeUp 0.8s ease-out 0.5s both;
}

.chart-title {
  font-size: 14px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: var(--text-1);
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.chart-filters {
  display: flex;
  gap: 10px;
}

.filter-btn {
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid rgba(61, 91, 254, 0.2);
  background: transparent;
  color: var(--text-2);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-mono);
}

.filter-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.filter-btn.active {
  background: var(--primary);
  border-color: var(--primary);
  color: white;
}

.chart-holder {
  height: 280px;
  position: relative;
}

/* TV Mode */
body.tv-mode {
  padding: 0;
}

body.tv-mode .header {
  padding: 20px 40px;
}

body.tv-mode .container {
  padding: 32px 40px;
}

body.tv-mode .hero-card {
  padding: 40px;
  margin-bottom: 20px;
}

body.tv-mode .hero-top {
  gap: 40px;
  margin-bottom: 0;
}

body.tv-mode .hero-value {
  font-size: 64px;
}

body.tv-mode .hero-top > div:last-child {
  padding: 24px;
}

body.tv-mode .hero-top > div:last-child .hero-value {
  font-size: 44px;
}

body.tv-mode .stats-grid {
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 0;
}

body.tv-mode .stat-card {
  padding: 20px;
}

body.tv-mode .stat-card-value {
  font-size: 32px;
}

body.tv-mode .chart-section {
  display: none;
}

body.tv-mode .header-actions .icon-btn:not(#btn-tv) {
  display: none;
}

/* Scroll */
::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: rgba(61, 91, 254, 0.3);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: rgba(61, 91, 254, 0.5);
}

/* Loading */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--text-2);
  font-family: var(--font-mono);
  font-size: 13px;
  padding: 60px 0;
}

.spin {
  width: 16px;
  height: 16px;
  border: 2px solid rgba(61, 91, 254, 0.2);
  border-top-color: var(--primary);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
</style>
</head>
<body>
<canvas id="canvas-bg"></canvas>

<div class="wrap">
  <div class="header">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#3D5BFE;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2D3F9E;stop-opacity:1" />
          </linearGradient>
        </defs>
        <rect width="240" height="240" rx="40" fill="url(#logoGrad)"/>
        <text x="120" y="110" font-family="'Inter', -apple-system, sans-serif" font-size="100" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-3" dominant-baseline="middle">alpha</text>
        <text x="120" y="165" font-family="'Inter', -apple-system, sans-serif" font-size="28" font-weight="700" fill="white" text-anchor="middle" letter-spacing="2">FM 101.7</text>
      </svg>
      <div class="brand-text">
        <h1>Alpha FM · Instagram</h1>
        <p id="brand-subtitle">@radiosalphafm · atualizado agora</p>

    <div class="header-actions">
      <span class="status-chip"><span class="live-dot"></span>ao vivo</span>
      <div class="icon-btn" id="btn-export" title="Exportar XLSX">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
      </div>
      <div class="icon-btn" id="btn-tv" title="Modo TV">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>
      </div>
      <div class="icon-btn" id="btn-refresh" title="Atualizar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
      </div>
    </div>
  </div>

  <div class="container" id="app">
    <div class="loading"><div class="spin"></div> carregando</div>

<script>
// Three.js Background
const canvas = document.getElementById('canvas-bg');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(0x000000, 0);
camera.position.z = 5;

// Partículas de fundo
const particlesGeometry = new THREE.BufferGeometry();
const particleCount = 300;
const positions = new Float32Array(particleCount * 3);

for (let i = 0; i < particleCount * 3; i += 3) {
  positions[i] = (Math.random() - 0.5) * 20;
  positions[i + 1] = (Math.random() - 0.5) * 20;
  positions[i + 2] = (Math.random() - 0.5) * 20;
}

particlesGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const particlesMaterial = new THREE.PointsMaterial({
  color: 0x5470FF,
  size: 0.08,
  sizeAttenuation: true,
  transparent: true,
  opacity: 0.4,
});

const particles = new THREE.Points(particlesGeometry, particlesMaterial);
scene.add(particles);

// Animação
function animate() {
  requestAnimationFrame(animate);
  particles.rotation.x += 0.0001;
  particles.rotation.y += 0.0002;
  renderer.render(scene, camera);
}

animate();

// Resize
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const API_URL = 'https://alpha-fm-api-git-main-alpha-fm1.vercel.app/api/data';
const LOGO_SRC = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAoAAAAKCAYAAACNMs+9AAAACXBIWXMAABcSAAAXEgFxLsqaAAAA20lEQVQYV5XRMQ7CMBBFUYrEVliQkJhYmZiZWBhYWViYuAEn4AZcgBtwAk7ACbgBFwCLhKBgYmKhhYSSloGEhsiwieVJblJ7b8+/99vd3/+Zx+NxvV6f7/d5WJYFj8cj7vf7P/v9Pns8nnhZFn6eJ8vLdR0+z1N+npdxXZflcRjSNE3par/ff1MU5e12o2maeJ5HnudRVRW0bRvO53N+PIe2bZNlmbhcLjQvS0ZRRJIkfP9Rvq4rKorCjxKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQikUgkEolEIpFIJBKJRCKRSCQSiUQi/fgDJ1jH8cPMxfwAAAAASUVORK5CYII=';

async function fetchAllData(){
  const res = await fetch(API_URL);
  if(!res.ok) throw new Error('API error: ' + res.status);
  return res.json();
}

async function fetchHistory(){
  try {
    const res = await fetch('https://raw.githubusercontent.com/kevinkeizo/alpha-fm-dashboard/main/history.json');
    if(!res.ok) return [];
    return res.json();
  } catch(e) {
    return [];
  }
}

async function fetchPosts(){
  try{
    const res = await fetch(API_URL.replace('/api/data', '/api/posts'));
    if(!res.ok) return { posts: [], resumo: null };
    const json = await res.json();
    return { posts: json.posts || [], resumo: json.resumo || null };
  }catch(e){
    console.error('Posts falhou:', e.message);
    return { posts: [], resumo: null };
  }
}

// Ranking guardado pelo snapshot noturno: 35 dias de recentes + top de sempre
async function fetchTopGuardado(){
  try{
    const res = await fetch('https://raw.githubusercontent.com/kevinkeizo/alpha-fm-dashboard/main/top-posts.json');
    if(!res.ok) return { recentes: [], allTime: [] };
    const j = await res.json();
    return { recentes: j.recentes || [], allTime: j.allTime || [] };
  }catch(e){
    return { recentes: [], allTime: [] };
  }
}

// O dia de hoje vem ao vivo: o snapshot só grava o dia já fechado
async function fetchTopHoje(){
  try{
    const res = await fetch(API_URL.replace('/api/data', '/api/top'));
    if(!res.ok) return [];
    const j = await res.json();
    return j.posts || [];
  }catch(e){
    return [];
  }
}

function formatNum(n) {
  if (n === null || n === undefined) return '—';
  return n.toLocaleString('pt-BR');
}

// Comparativo com ontem. O dia de hoje ainda está correndo, então uma seta
// vermelha ficaria acesa a maior parte do tempo só porque o dia não acabou.
// Mostra o valor de ontem como referência e só comemora quando já superou.
function delta(hoje, ontem) {
  if (hoje == null || ontem == null) {
    return '<div class="stat-card-delta delta-flat">sem comparativo ainda</div>';
  }
  if (hoje >= ontem) {
    return `<div class="stat-card-delta delta-up">↑ já passou ontem (${formatNum(ontem)})</div>`;
  }
  const pct = Math.round((hoje / ontem) * 100);
  return `<div class="stat-card-delta delta-flat">ontem fechou em ${formatNum(ontem)} · ${pct}%</div>`;
}

function fmtTime() {
  return new Date().toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

function lineChartSvg(dates, values) {
  if(!values.length) return '';
  const h = 280, w = 900, padding = 50;
  const minVal = Math.min(...values);
  const maxVal = Math.max(...values);
  const range = maxVal - minVal || 1;

  const points = values.map((v, i) => {
    const x = padding + (i / (Math.max(1, values.length - 1))) * (w - padding * 2);
    const y = h - padding - ((v - minVal) / range) * (h - padding * 2 - 30);
    return {x, y, v, date: dates[i]};
  });

  const pathD = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');

  const step = Math.ceil(points.length / 5);
  const labels = points.filter((p, i) => i % step === 0 || i === points.length - 1).map(p =>
    `<text x="${p.x}" y="${h - 15}" text-anchor="middle" font-size="11" fill="var(--text-2)" font-family="var(--font-mono)">${p.date.slice(-5)}</text>`
  ).join('');

  const pointsCircles = points.map(p =>
    `<circle cx="${p.x}" cy="${p.y}" r="3" fill="#3D5BFE"/><text x="${p.x}" y="${p.y - 12}" text-anchor="middle" font-size="10" fill="#3D5BFE" font-weight="bold" font-family="var(--font-mono)">${(p.v/1000).toFixed(0)}K</text>`
  ).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;">
    <defs>
      <linearGradient id="areaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" style="stop-color:#5470FF;stop-opacity:0.25"/>
        <stop offset="100%" style="stop-color:#5470FF;stop-opacity:0"/>
      </linearGradient>
    </defs>
    <path d="${pathD} L ${points[points.length-1].x} ${h-padding} L ${points[0].x} ${h-padding}" fill="url(#areaGrad)"/>
    <path d="${pathD}" stroke="#3D5BFE" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    ${pointsCircles}
    ${labels}
  </svg>`;
}

function barChartSvg(dates, values) {
  if(!values.length) return '';
  const h = 200, w = 600, padding = 40;
  const maxVal = Math.max(...values, 1);
  const barWidth = (w - padding * 2) / values.length * 0.7;
  const barGap = (w - padding * 2) / values.length;

  const bars = values.map((v, i) => {
    const x = padding + i * barGap + (barGap - barWidth) / 2;
    const barH = (v / maxVal) * (h - padding * 2);
    const y = h - padding - barH;
    return `<rect x="${x}" y="${y}" width="${barWidth}" height="${barH}" fill="#3D5BFE" rx="3"/>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;">
    ${bars}
  </svg>`;
}

        <div class="stat-card-value">${formatNum(totalInteractions)}</div>
        ${delta(totalInteractions, ontem && ontem.interactions)}
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Publicações (hoje)</div>
        <div class="stat-card-value">${formatNum(postsToday)}</div>
        <div class="stat-card-delta delta-flat">${formatNum(media_count)} no total</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-label">Taxa de Engajamento</div>
        <div class="stat-card-value">${engagementRate !== null ? engagementRate.toFixed(1) : '—'}%</div>
        ${engagementRate !== null && ontem && ontem.engagementRate != null
          ? `<div class="stat-card-delta ${engagementRate >= ontem.engagementRate ? 'delta-up' : 'delta-down'}">${engagementRate >= ontem.engagementRate ? '↑' : '↓'} ${Math.abs(engagementRate - ontem.engagementRate).toFixed(1)} p.p. vs ontem</div>`

    <div class="chart-section">

      </div>
    </div>
  `;

  document.getElementById('btn-tv').addEventListener('click', () => {
    document.body.classList.toggle('tv-mode');
  });

  document.getElementById('btn-refresh').addEventListener('click', () => {
    location.reload();
  });

  document.getElementById('btn-export').addEventListener('click', async () => {
    try {
      const history = await fetchHistory();
      if(!history.length) {
        alert('Sem histórico pra exportar');
        return;
      }

      const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));

      const ws = XLSX.utils.json_to_sheet(sorted.map((h, i) => {
        const prev = i > 0 ? sorted[i-1] : null;
        let gain = null, variation = null;
        if(prev && h.followers != null && prev.followers != null){
          gain = h.followers - prev.followers;
          if(prev.followers) variation = (gain / prev.followers) * 100;
        }
        return {
          'Data': h.date,
          'Seguidores': h.followers,
          'Ganho no dia': gain,
          'Variação %': variation !== null ? +variation.toFixed(3) : null,
          'Alcance': h.reach,
          'Visualizações': h.views ?? null,
          'Views dos reels': h.reelViews ?? null,
          'Reels': h.reels ?? null,
          'Publicações': h.posts,
          'Interações': h.interactions,
          'Taxa Engajamento': h.engagementRate != null ? +h.engagementRate.toFixed(2) : null
        };
      }));

      ws['!cols'] = [
        {wch: 12}, {wch: 12}, {wch: 13}, {wch: 11}, {wch: 12},
        {wch: 14}, {wch: 15}, {wch: 8}, {wch: 13}, {wch: 12}, {wch: 18}
      ];
      ws['!freeze'] = {xSplit: 0, ySplit: 1};

      // Formatos numéricos (linha 1 é cabeçalho, dados começam na 2)
      const range = XLSX.utils.decode_range(ws['!ref']);
      for(let r = 1; r <= range.e.r; r++){
        const fmt = (col, z) => {
          const cell = ws[XLSX.utils.encode_cell({c: col, r})];
          if(cell && cell.t === 'n') cell.z = z;
        };
        fmt(1, '#,##0');      // Seguidores
        fmt(2, '+#,##0;-#,##0'); // Ganho no dia
        fmt(3, '0.000"%"');   // Variação %
        fmt(4, '#,##0');      // Alcance
        fmt(5, '#,##0');      // Visualizações
        fmt(6, '#,##0');      // Views dos reels
        fmt(9, '#,##0');      // Interações
        fmt(10, '0.00"%"');   // Taxa Engajamento
      }

      // Cabeçalho em negrito (linha 1, todas as colunas)
      for(let c = range.s.c; c <= range.e.c; c++){
        const cell = ws[XLSX.utils.encode_cell({c, r: 0})];
        if(cell) cell.s = {
          font: {bold: true, color: {rgb: 'FFFFFF'}},
          fill: {fgColor: {rgb: '3D5BFE'}},
          alignment: {horizontal: 'center'}
        };
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Analytics');
      XLSX.writeFile(wb, `alpha-fm-analytics-${new Date().toISOString().split('T')[0]}.xlsx`);
    } catch(e) {
      alert('Erro ao exportar: ' + e.message);
    }
  });

  // Renderiza gráfico de seguidores, com filtro de período
  (async () => {
    const history = await fetchHistory();
    const chartEl = document.getElementById('chart-followers');
    if(!chartEl) return;

    // Descarta dias sem seguidores mantendo data e valor pareados
    const pontos = [...history]
      .sort((a,b) => a.date.localeCompare(b.date))
      .filter(h => h.followers != null);

    function desenhar(days){
      const recorte = days === 'all' ? pontos : pontos.slice(-Number(days));
      if(recorte.length === 0){
        chartEl.innerHTML = '<p style="color: var(--text-3); text-align: center; padding: 40px 0; font-family: var(--font-mono);">Sem dados nesse período</p>';
        return;
      }
      if(recorte.length === 1){
        chartEl.innerHTML = `<p style="color: var(--text-3); text-align: center; padding: 40px 0; font-family: var(--font-mono);">Só 1 dia registrado (${recorte[0].date}) — o gráfico aparece a partir de 2 dias</p>`;
        return;
      }
      chartEl.innerHTML = lineChartSvg(recorte.map(h => h.date), recorte.map(h => h.followers));
    }

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        desenhar(btn.dataset.days);
      });
    });

    desenhar('all');
  })();
}

// Load
async function load(){
  try{
    const [data, history, posts] = await Promise.all([fetchAllData(), fetchHistory(), fetchPosts()]);

    // Calcula dailyGain comparando com dia anterior
    if(history.length > 0) {
      const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));
      const yesterday = sorted[sorted.length - 1];
      if(yesterday && yesterday.followers) {
        data.dailyGain = (data.profile.followers_count - yesterday.followers);
      }
      // Último dia fechado, usado como referência nos cards
      data.ontem = yesterday || null;
    }

    renderDashboard(data);
    renderPosts(posts.posts, posts.resumo);

    // O ranking é mais lento (uma chamada por publicação), então não segura
    // o resto do dashboard: entra assim que ficar pronto.
    Promise.all([fetchTopHoje(), fetchTopGuardado()])
      .then(([hoje, guardado]) => renderTop(hoje, guardado))
      .catch(() => {});
  }catch(e){
    document.getElementById('app').innerHTML = `<div class="loading" style="color:red;">Erro: ${e.message}</div>`;
  }
}

function renderPosts(posts, resumo){
  const container = document.getElementById('posts-preview');
  if(!container) return;

  const cabecalho = document.getElementById('posts-resumo');
  if(cabecalho && resumo){
    cabecalho.textContent = resumo.reelsHoje
      ? `${resumo.postsHoje} hoje · ${resumo.reelsHoje} reels · ${formatNum(resumo.viewsHoje)} views`
      : `${resumo.postsHoje} publicações hoje`;
  }

  // Filtro por tipo. Reel e vídeo contam como "reels"; o resto é "posts".
  document.querySelectorAll('.tipo-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tipo-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const t = btn.dataset.tipo;
      const recorte = t === 'reels' ? posts.filter(p => p.isVideo)
                    : t === 'posts' ? posts.filter(p => !p.isVideo)
                    : posts;
      desenharPosts(container, recorte, t);
    });
  });

  desenharPosts(container, posts, 'todos');
}

function renderTop(hoje, guardado){
  const lista = document.getElementById('top-lista');
  const nota = document.getElementById('top-nota');
  if(!lista) return;

  // O arquivo só tem dias fechados, então o de hoje entra sempre pelo ao vivo.
  function juntar(guardados){
    const porId = new Map();
    [...guardados, ...hoje].forEach(p => porId.set(p.id, p));
    return [...porId.values()].sort((a, b) => (b.interactions ?? -1) - (a.interactions ?? -1));
  }

  function recorte(periodo){
    if(periodo === 'hoje') return hoje;
    if(periodo === 'all') return juntar(guardado.allTime);
    const corte = new Date(Date.now() - Number(periodo) * 86400000).toISOString().slice(0, 10);
    return juntar(guardado.recentes.filter(p => p.date >= corte));
  }

  function desenhar(periodo){
    const posts = recorte(periodo).slice(0, 10);

    if(nota){
      const temFollows = posts.some(p => p.follows != null);
      nota.textContent = temFollows
        ? 'Ordenado por interações. O Instagram só informa seguidores ganhos em imagens e carrosséis — reels não reportam.'
        : 'Ordenado por interações.';
    }

    if(posts.length === 0){
      lista.innerHTML = `<div style="color: var(--text-3); text-align: center; padding: 30px 0; font-family: var(--font-mono); font-size: 12px;">${
        periodo === 'hoje' ? 'Nenhuma publicação hoje ainda' : 'Sem dados nesse período ainda — o histórico começa a encher a cada noite'
      }</div>`;
      return;
    }

    lista.innerHTML = posts.map((p, i) => `
      <a href="${p.permalink}" target="_blank" style="text-decoration: none; display: flex; align-items: center; gap: 14px; padding: 10px 14px; border: 1px solid rgba(61, 91, 254, 0.15); border-radius: 12px; background: rgba(255,255,255,0.5); transition: all 0.2s ease;"
         onmouseover="this.style.borderColor='var(--primary)'; this.style.background='rgba(255,255,255,0.9)'"
         onmouseout="this.style.borderColor='rgba(61, 91, 254, 0.15)'; this.style.background='rgba(255,255,255,0.5)'">
        <span style="font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: ${i < 3 ? 'var(--primary)' : 'var(--text-3)'}; min-width: 22px;">${i + 1}</span>
        <div style="position: relative; width: 46px; height: 46px; border-radius: 8px; overflow: hidden; flex-shrink: 0; background: rgba(61,91,254,0.08);">
          ${p.media_url ? `<img src="${p.media_url}" loading="lazy" style="width:100%; height:100%; object-fit: cover;">` : ''}
        </div>
        <div style="flex: 1; min-width: 0;">
          <div style="font-size: 12px; color: var(--text-1); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${p.caption || '(sem legenda)'}</div>
          <div style="font-size: 11px; color: var(--text-3); font-family: var(--font-mono); margin-top: 3px;">
            ${p.isVideo ? 'REEL' : p.media_type === 'CAROUSEL_ALBUM' ? 'CARROSSEL' : 'IMAGEM'} · ${p.date ? p.date.slice(8) + '/' + p.date.slice(5,7) : ''} ${p.hora || ''}
          </div>
        </div>
        <div style="display: flex; gap: 18px; text-align: right; flex-shrink: 0;">
          <div>
            <div style="font-size: 15px; font-weight: 700; color: var(--text-1); font-family: var(--font-mono);">${formatNum(p.interactions)}</div>
            <div style="font-size: 10px; color: var(--text-3);">interações</div>
          </div>
          <div style="min-width: 62px;">
            <div style="font-size: 15px; font-weight: 700; color: var(--text-2); font-family: var(--font-mono);">${formatNum(p.reach)}</div>
            <div style="font-size: 10px; color: var(--text-3);">alcance</div>
          </div>
          <div style="min-width: 54px;">
            <div style="font-size: 15px; font-weight: 700; color: ${p.follows ? 'var(--success)' : 'var(--text-3)'}; font-family: var(--font-mono);">${p.follows != null ? '+' + p.follows : '—'}</div>
            <div style="font-size: 10px; color: var(--text-3);">seguidores</div>
          </div>
        </div>
      </a>
    `).join('');
  }

  document.querySelectorAll('.top-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.top-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      desenhar(btn.dataset.periodo);
    });
  });

  desenhar('hoje');
}

function desenharPosts(container, posts, tipo){
  if(posts.length === 0){
    const msg = tipo === 'reels' ? 'Nenhum reel nas últimas publicações'
              : tipo === 'posts' ? 'Nenhum post nas últimas publicações'
              : 'Não foi possível carregar as publicações';
    container.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px 20px; color: var(--text-3); font-family: var(--font-mono); font-size: 12px;">${msg}</div>`;
    return;
  }

  container.innerHTML = posts.slice(0, 9).map(post => `
    <a href="${post.permalink}" target="_blank" style="text-decoration: none; display: block;">
      <div style="aspect-ratio: 1; background: linear-gradient(135deg, rgba(61, 91, 254, 0.1) 0%, rgba(84, 112, 255, 0.05) 100%); border: 1px solid rgba(61, 91, 254, 0.2); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: all 0.3s ease; cursor: pointer;">
        <div style="position: relative; width: 100%; height: 70%;">
          ${post.media_url
            ? `<img src="${post.media_url}" loading="lazy" style="width: 100%; height: 100%; object-fit: cover; background: rgba(61, 91, 254, 0.1);">`
            : '<div style="width: 100%; height: 100%; background: rgba(61, 91, 254, 0.1); display: flex; align-items: center; justify-content: center;"><span style="color: var(--text-3); font-size: 11px;">Sem prévia</span></div>'}
          ${post.isReel ? '<span style="position: absolute; top: 8px; right: 8px; background: rgba(15,20,25,0.75); color: #fff; font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 6px;">REEL</span>' : ''}
          ${post.isHoje ? `<span style="position: absolute; top: 8px; left: 8px; background: rgba(61,91,254,0.9); color: #fff; font-size: 10px; font-weight: 600; padding: 3px 7px; border-radius: 6px;">${post.hora}</span>` : ''}
          ${post.views != null ? `<span style="position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(15,20,25,0.8)); color: #fff; font-size: 13px; font-weight: 700; padding: 16px 8px 6px; text-align: center;">▶ ${formatNum(post.views)}</span>` : ''}
        </div>
        <div style="padding: 8px; display: flex; gap: 8px; justify-content: center; font-size: 11px; color: var(--text-2); border-top: 1px solid rgba(61, 91, 254, 0.1);">
          <span>❤️ ${formatNum(post.like_count)}</span>
          <span>💬 ${formatNum(post.comments_count)}</span>
        </div>
      </div>
    </a>
  `).join('');
}

load();
</script>
