<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha FM · Instagram</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F8F9FB;
    --surface: #FFFFFF;
    --surface-2: #F3F4FA;
    --border: #E0E3F0;
    --text-1: #0F1419;
    --text-2: #5C5F73;
    --text-3: #8B8D9A;
    --blue: #3D5BFE;
    --blue-light: #5470FF;
    --success: #22C55E;
    --danger: #EF4444;
    --accent: #FF6B35;
    --font-display: 'Plus Jakarta Sans', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: var(--bg);
    color: var(--text-1);
    font-family: var(--font-display);
    padding: 24px 16px 60px;
    min-height:100vh;
    position: relative;
    overflow-x: hidden;
  }
  @keyframes float1 {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(50px, -50px); }
    66% { transform: translate(-30px, 40px); }
  }
  @keyframes float2 {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(-60px, 30px); }
    66% { transform: translate(40px, -40px); }
  }
  @keyframes float3 {
    0%, 100% { transform: translate(0, 0); }
    33% { transform: translate(40px, 60px); }
    66% { transform: translate(-50px, -30px); }
  }
  body::before{
    content:''; position: fixed; top:-20%; right:-5%; width:800px; height:800px;
    background: radial-gradient(circle, rgba(61,91,254,.08), rgba(61,91,254,0) 70%);
    pointer-events: none; z-index: 0;
    animation: float1 20s ease-in-out infinite;
  }
  body::after{
    content:''; position: fixed; bottom:-20%; left:-5%; width:600px; height:600px;
    background: radial-gradient(circle, rgba(255,107,53,.05), rgba(255,107,53,0) 70%);
    pointer-events: none; z-index: 0;
    animation: float2 25s ease-in-out infinite;
  }
  .wrap{max-width: 880px; margin: 0 auto; position: relative; z-index: 1;}
  .wrap::before{
    content:''; position: fixed; top:50%; left:10%; width:500px; height:500px;
    background: radial-gradient(circle, rgba(34,197,94,.04), rgba(34,197,94,0) 70%);
    pointer-events: none; z-index: 0;
    animation: float3 30s ease-in-out infinite;
  }

  /* Header */
  .header{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; margin-bottom:28px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-logo{
    width:44px; height:44px; border-radius:11px; display:block; object-fit:cover;
    box-shadow: 0 2px 8px rgba(25,42,184,.25);
  }
  .brand-text h1{font-size:16px; font-weight:800; letter-spacing:.2px;}
  .brand-text p{font-size:12px; color:var(--text-2); font-family:var(--font-mono);}
  .header-actions{display:flex; align-items:center; gap:10px;}
  .icon-btn{
    background: var(--surface); border:1px solid var(--border); color: var(--text-2);
    width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition: all .15s ease;
  }
  .icon-btn:hover{color: var(--blue); border-color: var(--blue);}
  .icon-btn svg{width:16px; height:16px;}
  .status-chip{
    font-family: var(--font-mono); font-size:11px; color: var(--text-2);
    background: var(--surface); border:1px solid var(--border); padding:6px 10px; border-radius:20px;
    display:flex; align-items:center; gap:6px;
  }
  .live-dot{
    width:7px; height:7px; border-radius:50%; background: var(--success);
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.25;} }

  /* Modo TV: telas grandes, sem interacao, tudo ampliado */
  body.tv-mode{ padding: 40px 56px; }
  body.tv-mode .wrap{ max-width: 1500px; }
  body.tv-mode .brand-logo{ width:64px; height:64px; border-radius:15px; }
  body.tv-mode .brand-text h1{ font-size: 30px; }
  body.tv-mode .brand-text p{ font-size: 16px; }
  body.tv-mode .status-chip{ font-size:15px; padding:9px 16px; }
  body.tv-mode .hero-card{ padding:40px; margin-bottom:24px; }
  body.tv-mode .hero-value{ font-size:88px; }
  body.tv-mode .icon-badge{ width:44px; height:44px; border-radius:13px; }
  body.tv-mode .icon-badge svg{ width:22px; height:22px; }
  body.tv-mode .secondary-grid{ gap:24px; margin-bottom:32px; }
  body.tv-mode .stat-card{ padding:32px; }
  body.tv-mode .stat-label{ font-size:16px; }
  body.tv-mode .stat-value{ font-size:64px; }
  body.tv-mode .stat-delta{ font-size:16px; margin-top:12px; }
  body.tv-mode .chart-card{ padding:32px; }
  body.tv-mode .chart-card h3{ font-size:17px; }
  body.tv-mode .chart-holder{ height:340px; }
  body.tv-mode .footer-note{ display:none; }
  body.tv-mode .header-actions .icon-btn:not(#btn-tv){ display:none; }

  /* Setup screen */
  .setup-card{
    background: var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:32px; max-width:480px; margin: 60px auto;
    box-shadow: 0 25px 50px rgba(0,0,0,.3), 0 0 1px rgba(0,212,255,.2);
    backdrop-filter: blur(10px);
  }
  .setup-card h2{font-size:20px; font-weight:800; margin-bottom:8px;}
  .setup-card p{font-size:13px; color:var(--text-2); line-height:1.6; margin-bottom:20px;}
  .field{margin-bottom:16px;}
  .field label{display:block; font-size:12px; color:var(--text-2); margin-bottom:6px; font-weight:600;}
  .field input{
    width:100%; background: var(--surface-2); border:1px solid var(--border); color:var(--text-1);
    padding:11px 12px; border-radius:10px; font-family: var(--font-mono); font-size:13px;
  }
  .field input:focus{outline:none; border-color: var(--blue);}
  .btn-primary{
    width:100%; padding:12px; border-radius:10px; border:none; cursor:pointer;
    background: var(--blue);
    color:#fff; font-weight:700; font-size:14px; margin-top:6px;
    transition: opacity .15s ease;
  }
  .btn-primary:hover{opacity:.9;}
  .setup-note{
    font-size:11px; color: var(--text-3); margin-top:16px; line-height:1.6;
    border-top:1px solid var(--border); padding-top:14px;
  }

  /* Error banner */
  .error-banner{
    background: rgba(239,68,68,.06); border:1px solid rgba(239,68,68,.2);
    color: var(--danger); font-size:12.5px; padding:12px 14px; border-radius:10px;
    margin-bottom:20px; font-family: var(--font-mono); line-height:1.5;
  }
  .warning-banner{
    background: rgba(255,180,0,.06); border:1px solid rgba(255,180,0,.25);
    color: #b8860b; font-size:12.5px; padding:12px 14px; border-radius:10px;
    margin-bottom:20px; font-family: var(--font-mono); line-height:1.5; font-weight:600;
  }
  .neutral-banner{
    background: var(--surface-2); border:1px solid var(--border);
    color: var(--text-2); font-size:12.5px; padding:12px 14px; border-radius:10px;
    margin-bottom:20px; font-family: var(--font-mono); line-height:1.5;
  }

  /* Entrance animation */
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .hero-card, .stat-card, .chart-card{ animation: fadeUp .5s ease both; }
  .secondary-grid .stat-card:nth-child(1){ animation-delay: .05s; }
  .secondary-grid .stat-card:nth-child(2){ animation-delay: .10s; }
  .secondary-grid .stat-card:nth-child(3){ animation-delay: .15s; }
  .secondary-grid .stat-card:nth-child(4){ animation-delay: .20s; }
  .chart-card:nth-of-type(1){ animation-delay: .25s; }
  .chart-card:nth-of-type(2){ animation-delay: .30s; }

  /* Icon badges */
  .icon-badge{
    width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    background: rgba(61,91,254,.1); color: var(--blue); flex-shrink:0;
  }
  .icon-badge svg{ width:16px; height:16px; }
  .stat-top{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }

  /* Hero card (Seguidores) */
  .hero-card{
    background: linear-gradient(135deg, rgba(61,91,254,.06) 0%, rgba(84,112,255,.03) 100%);
    border:1px solid rgba(61,91,254,.15); border-radius:20px; padding:26px;
    box-shadow: 0 2px 8px rgba(61,91,254,.08);
    margin-bottom:14px;
  }
  .hero-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .hero-value{
    font-size:44px; font-weight:800; font-family: var(--font-mono);
    background: linear-gradient(135deg, #3D5BFE 0%, #5470FF 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height:1;
  }
  .hero-chips{ display:flex; gap:8px; flex-wrap:wrap; }
  .hero-body{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; margin-top:14px; flex-wrap:wrap; }
  .sparkline-wrap{ flex:1; min-width:160px; }

  /* Stat cards */
  .secondary-grid{
    display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom:22px;
  }
  @media (max-width:900px){ .secondary-grid{grid-template-columns: repeat(2, 1fr);} }
  @media (max-width:520px){ .secondary-grid{grid-template-columns: 1fr;} }
  .stat-card{
    background: var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px;
    box-shadow: 0 1px 3px rgba(15,20,25,.08);
  }
  .stat-label{font-size:11.5px; color:var(--text-2); font-weight:600; text-transform:uppercase; letter-spacing:.5px;}
  .stat-value{
    font-size:26px; font-weight:800; font-family: var(--font-mono);
    color: var(--blue);
  }
  .stat-delta{
    font-size:11.5px; font-family: var(--font-mono); margin-top:8px; display:inline-flex; align-items:center; gap:4px;
    padding:3px 9px; border-radius:20px; font-weight:600;
  }
  .delta-up{color: var(--success); background: rgba(0,255,136,.12);}
  .delta-down{color: var(--danger); background: rgba(255,107,107,.12);}
  .delta-flat{color: var(--text-3); background: rgba(107,114,129,.12);}

  /* Charts */
  .chart-card{
    background: var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:20px; margin-bottom:14px;
    box-shadow: 0 1px 3px rgba(15,20,25,.08);
  }
  .chart-header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:16px; flex-wrap:wrap;}
  .chart-card h3{font-size:13px; color: var(--text-2); font-weight:700; text-transform:uppercase; letter-spacing:.4px;}
  .chart-filters{display:flex; gap:8px;}
  .filter-btn{
    padding:6px 12px; border-radius:8px; border:1px solid var(--border);
    background: var(--surface-2); color: var(--text-2); font-size:12px; font-weight:600;
    cursor:pointer; transition: all .15s ease;
  }
  .filter-btn:hover{border-color: var(--blue); color: var(--blue);}
  .filter-btn.active{background: var(--blue); color: #fff; border-color: var(--blue);}
  .chart-holder{height:220px;}
  .empty-hint{font-size:12px; color: var(--text-3); font-family: var(--font-mono); text-align:center; padding:30px 0;}

  .footer-note{
    text-align:center; font-size:11px; color: var(--text-3); margin-top:20px; font-family: var(--font-mono);
  }
  .footer-note a{color: var(--text-2); cursor:pointer; text-decoration: underline;}

  .loading{
    display:flex; align-items:center; justify-content:center; gap:8px;
    color: var(--text-2); font-family: var(--font-mono); font-size:12px; padding:40px 0;
  }
  .spin{
    width:14px; height:14px; border-radius:50%;
    border:2px solid var(--border); border-top-color: var(--blue);
    animation: spin .7s linear infinite;
  }
  @keyframes spin{to{transform: rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading"><div class="spin"></div> carregando</div>
</div>

const API_VERSION = 'v22.0';
const HISTORY_LIMIT = 800;
const app = document.getElementById('app');

// Fallback: se window.storage nao existir (arquivo aberto fora do Claude,
// direto no navegador), usa um objeto em memoria pra nao quebrar o app.
// Nesse modo os dados nao ficam salvos entre sessoes.
const claudeStorageAvailable = (typeof window.storage !== 'undefined' && window.storage !== null);
let persistenceMode = 'memory';
const memoryFallback = {};
let storageApi;
let tokenStatus = null;

if(claudeStorageAvailable){
  persistenceMode = 'claude';
  storageApi = window.storage;
}else{
  let localStorageWorks = false;
  try{
    const testKey = '__igdash_test__';
    window.localStorage.setItem(testKey, '1');
    window.localStorage.removeItem(testKey);
    localStorageWorks = true;
  }catch(e){ localStorageWorks = false; }

  if(localStorageWorks){
    persistenceMode = 'local';
    storageApi = {
      async get(key){
        const v = window.localStorage.getItem('igdash_' + key);
        return v === null ? null : { key, value: v };
      },
      async set(key, value){
        window.localStorage.setItem('igdash_' + key, value);
        return { key, value };
      },
      async delete(key){
        window.localStorage.removeItem('igdash_' + key);
        return { key, deleted: true };
      }
    };
  }else{
    persistenceMode = 'memory';
    storageApi = {
      async get(key){ return Object.prototype.hasOwnProperty.call(memoryFallback, key) ? { key, value: memoryFallback[key] } : null; },
      async set(key, value){ memoryFallback[key] = value; return { key, value }; },
      async delete(key){ delete memoryFallback[key]; return { key, deleted:true }; }
    };
  }
};

async function getConfig(){
  try{
    const r = await storageApi.get('ig_config');
    return r ? JSON.parse(r.value) : null;
  }catch(e){ return null; }
}
async function saveConfig(token, igUserId){
  await storageApi.set('ig_config', JSON.stringify({ token, igUserId }));
}
async function clearConfig(){
  try{ await storageApi.delete('ig_config'); }catch(e){}
}
async function getHistory(){
  try{
    const r = await storageApi.get('ig_history');
    return r ? JSON.parse(r.value) : [];
  }catch(e){ return []; }
}
async function saveHistory(arr){
  await storageApi.set('ig_history', JSON.stringify(arr));
}
// Lê o histórico gravado pelo GitHub Action (mesma origem do GitHub Pages).
// Falha silenciosa em file:// local ou se o arquivo ainda não existir — o
// dashboard continua funcionando só com o localStorage nesses casos.
async function fetchRemoteHistory(){
  try{
    const res = await fetch('./history.json', { cache: 'no-store' });
    if(!res.ok) return [];
    const arr = await res.json();
    return Array.isArray(arr) ? arr : [];
  }catch(e){ return []; }
}
// O Action roda 1x por dia e preenche os buracos de dias com o telão desligado;
// o navegador atualiza ao vivo o dia de hoje. Por isso hoje vem do local (mais
// fresco) e os dias passados vêm do remoto (existem mesmo sem o telão ligado).
function mergeHistories(remote, local){
  const byDate = new Map();
  remote.forEach(h => byDate.set(h.date, h));
  const key = todayKey();
  local.forEach(h => { if(h.date === key || !byDate.has(h.date)) byDate.set(h.date, h); });
  const merged = [...byDate.values()].sort((a, b) => a.date.localeCompare(b.date));
  return merged.length > HISTORY_LIMIT ? merged.slice(-HISTORY_LIMIT) : merged;
}
// Exporta em ponto-e-vírgula com vírgula decimal e BOM: é o que o Excel
// em pt-BR abre direto, sem passar pelo assistente de importação.
function exportHistoryCsv(history){
  if(!history || !history.length) return;
  const cell = v => (v === null || v === undefined) ? '' : String(v).replace('.', ',');
  const header = ['data','seguidores','ganho_seguidores','variacao_pct','alcance','publicacoes','interacoes','engajamento_pct'];
  const rows = history.map((h, i) => {
    const prev = i > 0 ? history[i-1] : null;
    const ganho = (h.followers !== null && prev && prev.followers !== null) ? h.followers - prev.followers : null;
    const variacaoPct = ganho !== null && prev && prev.followers ? (ganho / prev.followers * 100) : null;
    return [
      h.date,
      cell(h.followers),
      cell(ganho),
      cell(variacaoPct),
      cell(h.reach),
      cell(h.posts),
      cell(h.interactions),
      cell(h.engagementRate)
    ].join(';');
  });
  const csv = '﻿' + header.join(';') + '\r\n' + rows.join('\r\n') + '\r\n';
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8;' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'alpha-fm-instagram-' + todayKey() + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function todayKey(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function fmtNum(n){
  if(n === null || n === undefined) return '—';
  return n.toLocaleString('pt-BR');
}
function fmtTime(){
  return new Date().toLocaleString('pt-BR', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
}
function fmtPct(n){
  if(n === null || n === undefined) return '—';
  return n.toFixed(1).replace('.', ',') + '%';
}
function findEntryDaysAgo(sortedHistory, daysAgo){
  const target = new Date();
  target.setDate(target.getDate() - daysAgo);
  const targetStr = target.getFullYear() + '-' + String(target.getMonth()+1).padStart(2,'0') + '-' + String(target.getDate()).padStart(2,'0');
  const candidates = sortedHistory.filter(h => h.date <= targetStr);
  return candidates.length ? candidates[candidates.length - 1] : null;
}
function pctChange(curr, past){
  if(curr === null || curr === undefined || !past) return null;
  return ((curr - past) / past) * 100;
}
function sparklineSvg(values, color){
  if(!values || values.length < 2) return '';
  const w = 220, h = 56, pad = 4;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const step = (w - pad * 2) / (values.length - 1);
  const pts = values.map((v, i) => {
    const x = pad + i * step;
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return [x, y];
  });
  const line = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const area = line + ' L' + pts[pts.length-1][0].toFixed(1) + ',' + (h-pad) + ' L' + pts[0][0].toFixed(1) + ',' + (h-pad) + ' Z';
  const last = pts[pts.length - 1];
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" width="100%" height="' + h + '" preserveAspectRatio="none">' +
    '<path d="' + area + '" fill="' + color + '" fill-opacity="0.12" stroke="none"></path>' +
    '<path d="' + line + '" fill="none" stroke="' + color + '" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>' +
    '<circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3" fill="' + color + '"></circle>' +
    '</svg>';
}
function lineChartSvg(dates, values, color){
  if(!values || values.length < 2) return null;
  const w = 720, h = 240;
  const padL = 54, padR = 16, padT = 16, padB = 30;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || 1;
  const step = innerW / (values.length - 1);
  const pts = values.map((v, i) => [padL + i * step, padT + innerH - ((v - min) / range) * innerH]);
  const linePath = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = linePath + ' L' + pts[pts.length-1][0].toFixed(1) + ',' + (padT+innerH) + ' L' + pts[0][0].toFixed(1) + ',' + (padT+innerH) + ' Z';
  const ticks = 4, gridBits = [];
  for(let i=0;i<=ticks;i++){
    const y = padT + (innerH/ticks)*i;
    const val = max - (range/ticks)*i;
    gridBits.push('<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(padL+innerW)+'" y2="'+y.toFixed(1)+'" stroke="#E1E3EF" stroke-width="1"></line>');
    gridBits.push('<text x="'+(padL-8)+'" y="'+(y+3.5).toFixed(1)+'" text-anchor="end" font-size="10" font-family="JetBrains Mono, monospace" fill="#6B6E85">'+fmtNum(Math.round(val))+'</text>');
  }
  const maxLabels = 6, labelStep = Math.max(1, Math.ceil(dates.length / maxLabels));
  const xLabels = dates.map((d,i) => {
    if(i % labelStep !== 0 && i !== dates.length-1) return '';
    return '<text x="'+pts[i][0].toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10" font-family="JetBrains Mono, monospace" fill="#6B6E85">'+d.slice(5)+'</text>';
  }).join('');
  const last = pts[pts.length-1];
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="100%" preserveAspectRatio="none">'
    + gridBits.join('')
    + '<path d="'+areaPath+'" fill="'+color+'" fill-opacity="0.10" stroke="none"></path>'
    + '<path d="'+linePath+'" fill="none" stroke="'+color+'" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>'
    + pts.map(p => '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.5" fill="'+color+'"></circle>').join('')
    + '<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="4.5" fill="'+color+'" stroke="#fff" stroke-width="2"></circle>'
    + xLabels + '</svg>';
}
function barChartSvg(dates, values, color){
  if(!dates || !dates.length) return null;
  const w = 720, h = 240;
  const padL = 34, padR = 16, padT = 16, padB = 30;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const max = Math.max(1, ...values);
  const n = values.length, gap = 8;
  const barW = Math.max(4, (innerW - gap*(n-1)) / n);
  const bars = values.map((v,i) => {
    const x = padL + i*(barW+gap);
    const barH = Math.max((v/max)*innerH, v > 0 ? 3 : 0);
    const y = padT + innerH - barH;
    return '<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+barH.toFixed(1)+'" rx="3" fill="'+color+'"></rect>';
  }).join('');
  const maxLabels = 7, labelStep = Math.max(1, Math.ceil(n / maxLabels));
  const xLabels = dates.map((d,i) => {
    if(i % labelStep !== 0 && i !== n-1) return '';
    const x = padL + i*(barW+gap) + barW/2;
    return '<text x="'+x.toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle" font-size="10" font-family="JetBrains Mono, monospace" fill="#6B6E85">'+d.slice(5)+'</text>';
  }).join('');
  const gridLine = '<line x1="'+padL+'" y1="'+(padT+innerH)+'" x2="'+(padL+innerW)+'" y2="'+(padT+innerH)+'" stroke="#E1E3EF" stroke-width="1"></line>';
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" height="100%" preserveAspectRatio="none">' + gridLine + bars + xLabels + '</svg>';
}
function animateStatValues(){
  document.querySelectorAll('.js-count').forEach(el => {
    const raw = el.getAttribute('data-value');
    const suffix = el.getAttribute('data-suffix') || '';
    if(raw === null || raw === '' || raw === 'null'){ return; }
    const target = parseFloat(raw);
    if(isNaN(target)){ return; }
    const isPct = suffix === '%';
    const duration = 700;
    const start = performance.now();
    function tick(now){
      const p = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - p, 3);
      const val = target * eased;
      el.textContent = isPct ? (val.toFixed(1).replace('.', ',') + '%') : Math.round(val).toLocaleString('pt-BR');
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  });
}

async function fetchGraph(path, params, token){
  const API_URL = 'https://alpha-fm-api-git-main-alpha-fm1.vercel.app/api/data';
  const res = await fetch(API_URL);
  if(!res.ok) throw new Error('Erro ao conectar com a API (' + res.status + ')');
  const json = await res.json();
  if(json.error) throw new Error(json.error);
  return json;
}

async function fetchAllData(token, igUserId){
  // Modo público: API retorna tudo em uma chamada
  const data = await fetchGraph(null, null, null);

  return {
    profile: { followers_count: data.profile.followers_count, media_count: data.profile.media_count, username: data.profile.username },
    reach: data.reach,
    accountsEngaged: null,
    totalInteractions: data.totalInteractions,
    engagementRate: data.engagementRate,
    postsToday: data.postsToday,
    metricErrors: []
  };
}

function deltaHtml(curr, prev){
  if(prev === null || prev === undefined || curr === null || curr === undefined){
    return '<span class="stat-delta delta-flat">sem comparativo ainda</span>';
  }
  const diff = curr - prev;
  if(diff === 0) return '<span class="stat-delta delta-flat">= ontem</span>';
  const cls = diff > 0 ? 'delta-up' : 'delta-down';
  const arrow = diff > 0 ? '↑' : '↓';
  return `<span class="stat-delta ${cls}">${arrow} ${fmtNum(Math.abs(diff))} vs ontem</span>`;
}

function renderSetup(errorMsg){
  // Modo público: sem tela de login, carrega direto
  app.innerHTML = `

      ${errorMsg ? `<div class="error-banner" style="margin-top:20px;">${errorMsg}</div>` : ''}

  `;
}

      document.documentElement.requestFullscreen().catch(() => {});

  });
  const btnExport = document.getElementById('btn-export');
  if(btnExport) btnExport.addEventListener('click', () => exportHistoryCsv(sortedHistory));

    await clearConfig();
    renderSetup();

async function loadDashboard(forceLoading){
  if(forceLoading) app.innerHTML = '<div class="loading"><div class="spin"></div> atualizando</div>';

  try{
    const [data, remoteHistory] = await Promise.all([
      fetchAllData(null, null), // modo público: ignora params
      fetchRemoteHistory()
    ]);
    renderDashboard(data, remoteHistory, null, data.tokenStatus);
    startAutoRefresh();
  }catch(e){
    const remoteHistory = await fetchRemoteHistory();
    const fallback = { profile: { followers_count:null, media_count:null, username:'' }, reach:null, postsToday:null };
    renderDashboard(fallback, remoteHistory, 'Erro ao buscar dados ao vivo: ' + e.message + '.', null);
  }
}

// Modo telao: atualiza sozinho a cada 5 minutos, sem precisar de clique.
// Como e' um setInterval em memoria, funciona enquanto a aba ficar aberta;
// se a aba/TV reiniciar, o historico depende da persistencia configurada
// (window.storage no Claude, ou um backend proprio depois da hospedagem).
const REFRESH_INTERVAL_MS = 5 * 60 * 1000;
let refreshTimer = null;
function startAutoRefresh(){
  if(refreshTimer) return;
  refreshTimer = setInterval(() => { loadDashboard(false); }, REFRESH_INTERVAL_MS);
}

loadDashboard();
</script>
