<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alpha FM · Instagram Analytics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
/* ==========================================================================
   Alpha FM · Instagram Analytics
   Sistema visual derivado do assunto: uma rádio. Onda, frequência, sinal.
   ========================================================================== */

:root {
  /* Tinta — azul profundo de estúdio, não cinza neutro */
  --ink-1: #0B1020;
  --ink-2: #454B63;
  --ink-3: #7B8098;
  --ink-4: #A8ACBE;

  /* Superfícies */
  --bg: #F2F4FA;
  --bg-2: #E9ECF6;
  --surface: #FFFFFF;
  --line: rgba(11, 16, 32, 0.08);
  --line-strong: rgba(11, 16, 32, 0.14);

  /* Sinal — o azul da marca, em escala */
  --signal-100: #EEF1FF;
  --signal-200: #D6DDFF;
  --signal-400: #7C90FF;
  --signal-500: #3D5BFE;
  --signal-600: #2B41C7;
  --signal-700: #1D2C8C;

  /* Acentos: âmbar = pico, verde = ganho. Reservados, nunca decorativos. */
  --peak: #1D2C8C;
  --peak-soft: #E4E9FF;
  --gain: #12855F;
  --gain-soft: #E6F4EF;
  --drop: #C4384B;

  /* Texto sobre superfície */
  --font-display: 'Manrope', -apple-system, sans-serif;
  --font-body: 'Manrope', -apple-system, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, monospace;

  /* Curvas — as nativas do CSS são fracas demais pra parecer intencional */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);

  /* Elevação em três degraus, sempre com um tom de azul na sombra */
  --lift-1: 0 1px 2px rgba(11, 16, 32, 0.04), 0 2px 8px rgba(11, 16, 32, 0.03);
  --lift-2: 0 2px 4px rgba(11, 16, 32, 0.04), 0 8px 24px rgba(11, 16, 32, 0.06);
  --lift-3: 0 4px 8px rgba(29, 44, 140, 0.06), 0 16px 48px rgba(29, 44, 140, 0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  background: var(--bg);
  color: var(--ink-1);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  position: relative;
}

/* Números tabulares em tudo que é dado: sem isso, valores que atualizam
   dançam na horizontal a cada tick. */
.hero-value, .stat-card-value, .chip-value, .nav-badge,
.stat-card-delta, [data-num] {
  font-variant-numeric: tabular-nums;
  font-feature-settings: 'tnum' 1, 'zero' 1;
}

#canvas-bg {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* Vinheta suave: puxa o olho pro centro e disfarça a borda da malha 3D */
body::after {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background: radial-gradient(120% 90% at 50% 0%, transparent 40%, rgba(233, 236, 246, 0.55) 100%);
}

/* ============================ Casca ============================ */

.shell {
  position: relative;
  z-index: 2;
  display: flex;
  width: 100%;
  height: 100%;
}

.sidebar {
  width: 256px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  padding: 24px 14px 18px;
  gap: 26px;
  border-right: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.72);
  backdrop-filter: blur(24px) saturate(1.4);
  -webkit-backdrop-filter: blur(24px) saturate(1.4);
  transition: width 260ms var(--ease-out), padding 260ms var(--ease-out);
  overflow: hidden;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 8px;
}

.brand-logo {
  width: 38px;
  height: 38px;
  flex-shrink: 0;
  border-radius: 10px;
  box-shadow: var(--lift-2);
}

.sidebar-brand-text h1 {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.005em;
  white-space: nowrap;
  color: var(--ink-1);
}

.sidebar-brand-text p {
  font-size: 10px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  margin-top: 1px;
  white-space: nowrap;
}

.nav { display: flex; flex-direction: column; gap: 3px; flex: 1; }

.nav-label {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-4);
  padding: 0 12px;
  margin-bottom: 8px;
}

.nav-item {
  position: relative;
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 9px 12px;
  border-radius: 9px;
  border: none;
  background: transparent;
  color: var(--ink-2);
  font-size: 13px;
  font-weight: 550;
  font-family: var(--font-body);
  cursor: pointer;
  text-align: left;
  width: 100%;
  white-space: nowrap;
  transition: background-color 160ms ease, color 160ms ease, transform 140ms var(--ease-out);
}

.nav-item svg { width: 16px; height: 16px; flex-shrink: 0; stroke-width: 1.9; }

@media (hover: hover) and (pointer: fine) {
  .nav-item:hover { background: var(--signal-100); color: var(--signal-600); }
}

.nav-item:active { transform: scale(0.985); }

.nav-item.active {
  background: var(--signal-500);
  color: #fff;
  box-shadow: 0 2px 6px rgba(61, 91, 254, 0.24), 0 8px 20px rgba(61, 91, 254, 0.18);
}

/* Marca de sintonia: a barrinha à esquerda do item ativo */
.nav-item.active::before {
  content: '';
  position: absolute;
  left: -14px;
  top: 50%;
  width: 3px;
  height: 18px;
  border-radius: 0 3px 3px 0;
  background: var(--signal-500);
  transform: translateY(-50%);
}

.nav-badge {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  opacity: 0.7;
}

.sidebar-foot {
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

.status-chip {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 7px 12px;
  margin-bottom: 4px;
  background: var(--gain-soft);
  border: 1px solid rgba(18, 133, 95, 0.18);
  border-radius: 8px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--gain);
  font-family: var(--font-mono);
}

.live-dot {
  width: 6px;
  height: 6px;
  background: var(--gain);
  border-radius: 50%;
  position: relative;
  flex-shrink: 0;
}

/* Pulso de transmissão: anel que expande, não um fade de opacidade */
.live-dot::after {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: var(--gain);
  animation: transmit 2s var(--ease-out) infinite;
}

@keyframes transmit {
  0%   { transform: scale(1); opacity: 0.7; }
  70%  { transform: scale(3); opacity: 0; }
  100% { transform: scale(3); opacity: 0; }
}

.sidebar-action {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px;
  border-radius: 9px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink-2);
  font-size: 12px;
  font-weight: 550;
  font-family: var(--font-body);
  cursor: pointer;
  text-align: left;
  white-space: nowrap;
  transition: background-color 160ms ease, color 160ms ease, border-color 160ms ease, transform 140ms var(--ease-out);
}

.sidebar-action svg { width: 15px; height: 15px; flex-shrink: 0; stroke-width: 1.9; }

@media (hover: hover) and (pointer: fine) {
  .sidebar-action:hover {
    border-color: var(--line-strong);
    color: var(--signal-600);
    background: var(--surface);
  }
}

.sidebar-action:active { transform: scale(0.97); }

body.nav-collapsed .sidebar { width: 64px; padding-left: 10px; padding-right: 10px; }
body.nav-collapsed .sidebar-brand-text,
body.nav-collapsed .sidebar-action span,
body.nav-collapsed .nav-item span:not(.nav-badge),
body.nav-collapsed .nav-badge,
body.nav-collapsed .status-chip span:not(.live-dot),
body.nav-collapsed .nav-label { display: none; }
body.nav-collapsed .nav-item,
body.nav-collapsed .sidebar-action,
body.nav-collapsed .status-chip { justify-content: center; padding-left: 0; padding-right: 0; }
body.nav-collapsed .nav-item.active::before { left: -10px; }

.wrap {
  position: relative;
  flex: 1;
  min-width: 0;
  height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  scrollbar-width: thin;
  scrollbar-color: var(--line-strong) transparent;
}

.wrap::-webkit-scrollbar { width: 10px; }
.wrap::-webkit-scrollbar-thumb {
  background: var(--line-strong);
  border-radius: 10px;
  border: 3px solid transparent;
  background-clip: content-box;
}

.container {
  padding: 40px 44px 64px;
  max-width: 1360px;
  margin: 0 auto;
}

/* ============================ Views ============================ */

.view { display: none; }
.view.active { display: block; }

/* Entrada escalonada: cada bloco entra 50ms depois do anterior */
.view.active > * {
  opacity: 0;
  transform: translateY(10px);
  animation: riseIn 460ms var(--ease-out) forwards;
}
.view.active > *:nth-child(1) { animation-delay: 0ms; }
.view.active > *:nth-child(2) { animation-delay: 50ms; }
.view.active > *:nth-child(3) { animation-delay: 100ms; }
.view.active > *:nth-child(4) { animation-delay: 150ms; }

@keyframes riseIn {
  to { opacity: 1; transform: translateY(0); }
}

.view-head { margin-bottom: 30px; }

.view-head h2 {
  font-family: var(--font-display);
  font-size: 25px;
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--ink-1);
}

.view-head p {
  font-size: 13px;
  color: var(--ink-3);
  margin-top: 5px;
}

/* ============================ Hero ============================ */

.hero-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 38px 40px;
  margin-bottom: 22px;
  box-shadow: var(--lift-2);
  overflow: hidden;
}

/* Faixa de sinal no topo do card, como a régua de um equipamento */
.hero-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg,
    var(--signal-500) 0%, var(--signal-400) 32%,
    var(--peak) 62%, var(--signal-500) 100%);
  background-size: 200% 100%;
  animation: sweep 9s linear infinite;
}

@keyframes sweep {
  to { background-position: -200% 0; }
}

.hero-top {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 40px;
  align-items: stretch;
}

@media (max-width: 900px) {
  .hero-top { grid-template-columns: 1fr; gap: 28px; }
}

.hero-top > div:first-child {
  display: flex;
  flex-direction: column;
  gap: 14px;
  justify-content: flex-start;
}

.hero-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--ink-3);
}

.hero-value {
  font-family: var(--font-display);
  font-size: clamp(52px, 5.6vw, 76px);
  font-weight: 700;
  color: var(--ink-1);
  line-height: 0.92;
  letter-spacing: -0.022em;
}

/* Caixa de ganho: verde reservado, nunca decorativo */
.hero-top > div:last-child {
  display: flex;
  flex-direction: column;
  gap: 12px;
  padding: 26px 28px;
  background: var(--gain-soft);
  border: 1px solid rgba(18, 133, 95, 0.2);
  border-radius: 14px;
}

.hero-top > div:last-child .hero-label { color: var(--gain); }

.hero-top > div:last-child .hero-value {
  color: var(--gain);
  font-size: clamp(38px, 3.8vw, 52px);
}

.hero-top > div:last-child .stat-delta {
  font-size: 12px;
  font-weight: 700;
  color: var(--gain);
  font-family: var(--font-mono);
  margin-top: 2px;
}

.hero-chips {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  padding-top: 16px;
  border-top: 1px solid var(--line);
}

.chip {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 9px 12px;
  background: var(--signal-100);
  border-radius: 9px;
  border: 1px solid var(--signal-200);
}

.chip-label {
  font-size: 9px;
  color: var(--ink-3);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  font-weight: 700;
}

.chip-value {
  font-size: 14px;
  font-weight: 700;
  font-family: var(--font-mono);
  color: var(--signal-600);
}

/* ============================ Stat cards ============================ */

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
  margin-bottom: 22px;
}

@media (max-width: 1200px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px)  { .stats-grid { grid-template-columns: 1fr; } }

.stat-card {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px 22px;
  box-shadow: var(--lift-1);
  transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out), border-color 200ms ease;
}

@media (hover: hover) and (pointer: fine) {
  .stat-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--lift-3);
    border-color: var(--signal-200);
  }
}

.stat-card-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-3);
  margin-bottom: 10px;
}

.stat-card-value {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--ink-1);
  line-height: 1.05;
}

.stat-card-delta {
  margin-top: 8px;
  font-size: 11px;
  font-weight: 600;
  font-family: var(--font-mono);
}

.delta-up   { color: var(--gain); }
.delta-down { color: var(--drop); }
.delta-flat { color: var(--ink-4); }

/* ============================ Seções ============================ */

.chart-section {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px 26px 26px;
  margin-bottom: 20px;
  box-shadow: var(--lift-1);
}

.chart-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.chart-title > span:first-child {
  font-family: var(--font-display);
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.012em;
  color: var(--ink-1);
}

.chart-filters {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--bg-2);
  border-radius: 9px;
}

.filter-btn {
  padding: 6px 13px;
  border-radius: 7px;
  border: none;
  background: transparent;
  color: var(--ink-2);
  font-size: 11px;
  font-weight: 650;
  cursor: pointer;
  font-family: var(--font-body);
  transition: background-color 160ms ease, color 160ms ease, transform 140ms var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .filter-btn:hover { color: var(--ink-1); }
}

.filter-btn:active { transform: scale(0.96); }

.filter-btn.active {
  background: var(--surface);
  color: var(--signal-600);
  box-shadow: var(--lift-1);
}

.chart-holder { position: relative; }

/* ============================ Loading ============================ */

.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 120px 0;
  color: var(--ink-3);
  font-family: var(--font-mono);
  font-size: 12px;
}

.spin {
  width: 15px;
  height: 15px;
  border: 2px solid var(--signal-200);
  border-top-color: var(--signal-500);
  border-radius: 50%;
  /* Rápido de propósito: giro veloz faz o carregamento parecer mais curto */
  animation: spin 620ms linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* Esqueleto no lugar de spinner onde já se sabe a forma do conteúdo */
.skeleton {
  background: linear-gradient(90deg, var(--bg-2) 25%, #F5F7FC 50%, var(--bg-2) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s linear infinite;
  border-radius: 8px;
}

@keyframes shimmer { to { background-position: -200% 0; } }

/* ============================ Modo TV ============================ */

body.tv-mode .sidebar { display: none; }
body.tv-mode .container { max-width: none; padding: 30px 40px; }
body.tv-mode .view-head { display: none; }
body.tv-mode .hero-value { font-size: clamp(72px, 8vw, 118px); }
body.tv-mode .hero-top > div:last-child .hero-value { font-size: clamp(52px, 5.5vw, 82px); }
body.tv-mode .stat-card-value { font-size: 40px; }
body.tv-mode .stat-card { padding: 24px 26px; }
body.tv-mode .chart-section { padding: 26px 30px; }

/* ============================ Acessibilidade ============================ */

:focus-visible {
  outline: 2px solid var(--signal-500);
  outline-offset: 2px;
  border-radius: 6px;
}

/* Movimento reduzido: some o deslocamento, mantém opacidade e cor —
   que ainda ajudam a entender o que mudou. */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
  .view.active > * { opacity: 1; transform: none; }
  .stat-card:hover { transform: none; }
}

@media (max-width: 900px) {
  .sidebar { width: 64px; padding-left: 10px; padding-right: 10px; }
  .sidebar-brand-text, .sidebar-action span, .nav-item span:not(.nav-badge),
  .nav-badge, .nav-label, .status-chip span:not(.live-dot) { display: none; }
  .nav-item, .sidebar-action, .status-chip { justify-content: center; padding-left: 0; padding-right: 0; }
  .container { padding: 26px 20px 48px; }
  .hero-card { padding: 26px 24px; }
}


/* ============================ Tooltip do gráfico ============================ */

.chart-holder { position: relative; }

.grafico { display: block; overflow: visible; }

.grafico .crosshair { transition: opacity 140ms ease; }

.tooltip-grafico {
  position: absolute;
  pointer-events: none;
  z-index: 5;
  padding: 9px 12px;
  background: var(--ink-1);
  color: #fff;
  border-radius: 9px;
  box-shadow: var(--lift-3);
  opacity: 0;
  /* Nunca de scale(0): nada no mundo real aparece do nada */
  transform-origin: left center;
  transition: opacity 140ms var(--ease-out);
  white-space: nowrap;
}

.tooltip-grafico.visivel { opacity: 1; }

.tip-data {
  font-size: 10px;
  font-family: var(--font-mono);
  opacity: 0.6;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}

.tip-valor {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  margin-top: 2px;
}

.tip-ganho {
  font-size: 11px;
  font-family: var(--font-mono);
  color: #7BE0B8;
  margin-top: 2px;
}

/* ============================ Lista do ranking ============================ */

.rank-linha {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: var(--surface);
  text-decoration: none;
  transition: transform 180ms var(--ease-out), box-shadow 180ms var(--ease-out), border-color 180ms ease;
}

@media (hover: hover) and (pointer: fine) {
  .rank-linha:hover {
    transform: translateY(-1px);
    border-color: var(--signal-200);
    box-shadow: var(--lift-2);
  }
}

.rank-linha:active { transform: scale(0.995); }

.rank-pos {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink-4);
  min-width: 22px;
  font-variant-numeric: tabular-nums;
}

/* Só os três primeiros ganham cor — pódio, não decoração */
.rank-linha:nth-child(-n+3) .rank-pos { color: var(--signal-500); }

.rank-thumb {
  position: relative;
  width: 46px;
  height: 46px;
  border-radius: 9px;
  overflow: hidden;
  flex-shrink: 0;
  background: var(--bg-2);
}

.rank-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

.rank-meta { flex: 1; min-width: 0; }

.rank-cap {
  font-size: 12.5px;
  color: var(--ink-1);
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.rank-sub {
  font-size: 10.5px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  margin-top: 3px;
  display: flex;
  align-items: center;
  gap: 7px;
}

.rank-tag {
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 2px 6px;
  border-radius: 5px;
  background: var(--signal-100);
  color: var(--signal-600);
}

.rank-tag.reel { background: var(--peak-soft); color: var(--peak); }

.rank-nums { display: flex; gap: 20px; text-align: right; flex-shrink: 0; }

.rank-num-v {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-1);
  font-variant-numeric: tabular-nums;
}

.rank-num-l {
  font-size: 9px;
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 1px;
}

.rank-num-v.ganho { color: var(--gain); }
.rank-num-v.vazio { color: var(--ink-4); font-weight: 500; }

/* Entrada escalonada da lista */
.rank-linha {
  opacity: 0;
  animation: riseIn 380ms var(--ease-out) forwards;
}
.rank-linha:nth-child(1) { animation-delay: 0ms; }
.rank-linha:nth-child(2) { animation-delay: 35ms; }
.rank-linha:nth-child(3) { animation-delay: 70ms; }
.rank-linha:nth-child(4) { animation-delay: 105ms; }
.rank-linha:nth-child(5) { animation-delay: 140ms; }
.rank-linha:nth-child(n+6) { animation-delay: 170ms; }

/* ============================ Cartões de publicação ============================ */

.post-card {
  display: block;
  text-decoration: none;
  border: 1px solid var(--line);
  border-radius: 13px;
  overflow: hidden;
  background: var(--surface);
  transition: transform 200ms var(--ease-out), box-shadow 200ms var(--ease-out), border-color 200ms ease;
}

@media (hover: hover) and (pointer: fine) {
  .post-card:hover {
    transform: translateY(-3px);
    box-shadow: var(--lift-3);
    border-color: var(--signal-200);
  }
  .post-card:hover .post-img { transform: scale(1.04); }
}

.post-card:active { transform: scale(0.99); }

.post-media { position: relative; aspect-ratio: 1; overflow: hidden; background: var(--bg-2); }

.post-img {
  width: 100%; height: 100%; object-fit: cover; display: block;
  transition: transform 400ms var(--ease-out);
}

.post-badge {
  position: absolute;
  top: 8px; right: 8px;
  background: rgba(11, 16, 32, 0.72);
  backdrop-filter: blur(6px);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.08em;
  padding: 3px 7px;
  border-radius: 6px;
}

.post-hora {
  position: absolute;
  top: 8px; left: 8px;
  background: rgba(61, 91, 254, 0.9);
  color: #fff;
  font-size: 9px;
  font-weight: 700;
  font-family: var(--font-mono);
  padding: 3px 7px;
  border-radius: 6px;
}

.post-views {
  position: absolute;
  left: 0; right: 0; bottom: 0;
  padding: 22px 10px 8px;
  background: linear-gradient(transparent, rgba(11, 16, 32, 0.82));
  color: #fff;
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.post-foot {
  display: flex;
  gap: 12px;
  justify-content: center;
  padding: 9px;
  font-size: 11px;
  color: var(--ink-2);
  font-family: var(--font-mono);
  border-top: 1px solid var(--line);
  font-variant-numeric: tabular-nums;
}

.vazio-msg {
  grid-column: 1/-1;
  text-align: center;
  padding: 44px 20px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  font-size: 12px;
}


/* ==========================================================================
   Grid de 12 colunas + tiles assimétricos
   O padrão que Linear, Stripe, Vercel e Grafana convergiram: faixa de KPIs
   no topo, grid flexível abaixo, tamanho do tile = importância do dado.
   ========================================================================== */

.bento {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 12px;
  margin-bottom: 12px;
}

.col-3  { grid-column: span 3; }
.col-4  { grid-column: span 4; }
.col-5  { grid-column: span 5; }
.col-6  { grid-column: span 6; }
.col-7  { grid-column: span 7; }
.col-8  { grid-column: span 8; }
.col-12 { grid-column: span 12; }

@media (max-width: 1280px) {
  .col-3 { grid-column: span 6; }
  .col-4 { grid-column: span 6; }
  .col-5, .col-7, .col-8 { grid-column: span 12; }
}

@media (max-width: 760px) {
  .col-3, .col-4, .col-6 { grid-column: span 12; }
}

/* ============================ KPI card ============================ */

.kpi {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 13px;
  padding: 16px 18px 0;
  box-shadow: var(--lift-1);
  overflow: hidden;
  min-height: 132px;
  transition: border-color 200ms ease, box-shadow 200ms var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .kpi:hover { border-color: var(--signal-200); box-shadow: var(--lift-2); }
}

.kpi-top {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.kpi-label {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.11em;
  color: var(--ink-3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* Delta compacto: seta + número, sem frase */
.kpi-delta {
  font-family: var(--font-mono);
  font-size: 11px;
  font-weight: 700;
  padding: 2px 6px;
  border-radius: 5px;
  white-space: nowrap;
  flex-shrink: 0;
  font-variant-numeric: tabular-nums;
}

.kpi-delta.up   { color: var(--gain); background: var(--gain-soft); }
.kpi-delta.down { color: var(--drop); background: #FBEAEC; }
.kpi-delta.flat { color: var(--ink-4); background: var(--bg-2); }

.kpi-value {
  font-family: var(--font-display);
  font-size: 30px;
  font-weight: 500;
  letter-spacing: -0.018em;
  color: var(--ink-1);
  line-height: 1.08;
  margin-top: 10px;
  font-variant-numeric: tabular-nums;
}

.kpi-sub {
  font-size: 10.5px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  margin-top: 3px;
}

/* Sparkline sangra até a borda do card: vira o rodapé do tile */
.kpi-spark {
  margin: auto -18px 0;
  height: 40px;
  display: block;
}

/* ============================ Hero ============================ */

.hero-tile {
  position: relative;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 24px 26px 0;
  box-shadow: var(--lift-2);
  overflow: hidden;
  min-height: 210px;
}

.hero-tile::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--signal-500) 0%, var(--signal-400) 34%, var(--peak) 64%, var(--signal-500) 100%);
  background-size: 200% 100%;
  animation: sweep 9s linear infinite;
}

@keyframes sweep { to { background-position: -200% 0; } }

.hero-tile .hero-label {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  color: var(--ink-3);
}

.hero-tile .hero-value {
  font-family: var(--font-display);
  font-size: clamp(46px, 4.4vw, 62px);
  font-weight: 600;
  color: var(--ink-1);
  line-height: 0.94;
  letter-spacing: -0.022em;
  margin-top: 8px;
  font-variant-numeric: tabular-nums;
}

.hero-spark { margin: auto -26px 0; height: 76px; display: block; }

/* Tile de ganho: verde reservado ao que é de fato ganho */
.gain-tile {
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 6px;
  background: linear-gradient(160deg, var(--gain-soft) 0%, #F2FAF7 100%);
  border: 1px solid rgba(18, 133, 95, 0.22);
  border-radius: 16px;
  padding: 24px 26px;
  min-height: 210px;
}

.gain-tile .hero-label { color: var(--gain); letter-spacing: 0.16em; font-size: 10px; font-weight: 700; text-transform: uppercase; }

.gain-tile .hero-value {
  font-family: var(--font-display);
  font-size: clamp(38px, 3.7vw, 52px);
  font-weight: 600;
  color: var(--gain);
  line-height: 0.96;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.gain-meta {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid rgba(18, 133, 95, 0.16);
}

.gain-meta div { display: flex; flex-direction: column; gap: 1px; }

.gain-meta-l {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: rgba(18, 133, 95, 0.7);
  font-weight: 700;
}

.gain-meta-v {
  font-family: var(--font-mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--gain);
  font-variant-numeric: tabular-nums;
}

/* ============================ Comparação de formatos ============================ */

.fmt-lista { display: flex; flex-direction: column; gap: 12px; }

.fmt-linha { display: grid; grid-template-columns: 92px 1fr 116px; align-items: center; gap: 12px; }

.fmt-nome {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-2);
}

.fmt-barra {
  height: 26px;
  background: var(--bg-2);
  border-radius: 6px;
  overflow: hidden;
  position: relative;
}

.fmt-preenche {
  height: 100%;
  border-radius: 6px;
  background: var(--signal-500);
  width: 0;
  transition: width 700ms var(--ease-out);
}

.fmt-preenche.reel { background: var(--peak); }
.fmt-preenche.carrossel { background: var(--signal-500); }
.fmt-preenche.imagem { background: var(--signal-400); }

.fmt-num {
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-1);
  min-width: 74px;
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.fmt-num small {
  display: block;
  font-size: 9px;
  color: var(--ink-4);
  font-weight: 500;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

/* ============================ Ranking denso ============================ */

/* Barra de fundo proporcional: o tamanho relativo se lê sem comparar números */
.rank-linha { position: relative; overflow: hidden; }

.rank-linha > * { position: relative; z-index: 1; }

/* ============================ Distribuição por hora ============================ */

.horas {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
  gap: 2px;
  align-items: end;
  height: 84px;
}

.hora-col {
  background: var(--signal-200);
  border-radius: 3px 3px 0 0;
  min-height: 3px;
  transition: background-color 160ms ease, transform 160ms var(--ease-out);
  transform-origin: bottom;
}

.hora-col.pico { background: var(--peak); }

@media (hover: hover) and (pointer: fine) {
  .hora-col:hover { background: var(--signal-500); transform: scaleY(1.06); }
}

.horas-eixo {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
  gap: 2px;
  margin-top: 6px;
}

.horas-eixo span {
  font-size: 8.5px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  text-align: center;
}

/* ============================ Esqueletos ============================ */

.sk-kpi { min-height: 132px; border-radius: 13px; }
.sk-hero { min-height: 210px; border-radius: 16px; }
.sk-linha { height: 68px; border-radius: 12px; }

/* ============================ Modo TV ============================ */

body.tv-mode .kpi-value { font-size: 42px; }
body.tv-mode .kpi { min-height: 158px; }
body.tv-mode .hero-tile { min-height: 260px; }
body.tv-mode .gain-tile { min-height: 260px; }



/* ══ Fundo: aurora ═══════════════════════════════════════════════════════════
   A malha wireframe competia com o conteúdo — linha dura atrás de texto vira
   ruído. Três manchas desfocadas derivando devagar dão profundidade sem
   disputar atenção. Só transform anima, então roda na GPU sem custo de layout. */
.aurora {
  position: fixed;
  inset: 0;
  z-index: 0;
  overflow: hidden;
  pointer-events: none;
}

.aurora span {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  opacity: 0.5;
  will-change: transform;
}

.aurora span:nth-child(1) {
  width: 46vw; height: 46vw;
  top: -14vw; left: -8vw;
  background: radial-gradient(circle, rgba(61,91,254,0.30), transparent 68%);
  animation: deriva1 34s var(--ease-in-out) infinite;
}

.aurora span:nth-child(2) {
  width: 40vw; height: 40vw;
  top: 18vw; right: -10vw;
  background: radial-gradient(circle, rgba(124,144,255,0.26), transparent 68%);
  animation: deriva2 42s var(--ease-in-out) infinite;
}

.aurora span:nth-child(3) {
  width: 52vw; height: 52vw;
  bottom: -22vw; left: 24vw;
  background: radial-gradient(circle, rgba(29,44,140,0.16), transparent 70%);
  animation: deriva3 50s var(--ease-in-out) infinite;
}

@keyframes deriva1 {
  0%, 100% { transform: translate3d(0,0,0) scale(1); }
  50%      { transform: translate3d(6vw, 4vw, 0) scale(1.12); }
}
@keyframes deriva2 {
  0%, 100% { transform: translate3d(0,0,0) scale(1); }
  50%      { transform: translate3d(-5vw, 6vw, 0) scale(0.92); }
}
@keyframes deriva3 {
  0%, 100% { transform: translate3d(0,0,0) scale(1); }
  50%      { transform: translate3d(4vw, -5vw, 0) scale(1.08); }
}

@media (prefers-reduced-motion: reduce) {
  .aurora span { animation: none; }
}

/* ══ Ranking: grade fixa ═════════════════════════════════════════════════════
   Era flex, e a barra de fundo (que devia ser absoluta) entrava no fluxo e
   empurrava tudo em cascata. Agora é grid de colunas fixas: alinha sempre. */
.rank-linha {
  display: grid;
  grid-template-columns: 26px 44px minmax(0, 1fr) 86px 86px 78px;
  align-items: center;
  gap: 14px;
  position: relative;
  overflow: hidden;
  padding: 9px 16px;
}

/* Barra proporcional como pseudo-elemento: não existe no fluxo, não empurra */
.rank-linha::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: var(--peso, 0%);
  background: var(--signal-100);
  z-index: 0;
  transition: width 700ms var(--ease-out);
}

.rank-linha > * { position: relative; z-index: 1; }

.rank-thumb { width: 44px; height: 44px; }

.rank-meta { display: block; min-width: 0; }
.rank-cap { display: block; }
.rank-sub { display: flex; align-items: center; gap: 7px; }
.rank-num { display: block; text-align: right; }
.rank-num-v, .rank-num-l { display: block; }

.rank-num { text-align: right; }

.rank-num-v { font-size: 13.5px; }

.rank-pos { text-align: center; min-width: 0; }

@media (max-width: 1100px) {
  .rank-linha { grid-template-columns: 24px 40px minmax(0, 1fr) 76px; }
  .rank-num.esconde { display: none; }
}


.kpi { padding-bottom: 0; }

/* ══ Faixa de insights: 5 cards sem sobra ════════════════════════════════════ */
.strip-5 { grid-template-columns: repeat(5, 1fr); }
@media (max-width: 1280px) { .strip-5 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 700px)  { .strip-5 { grid-template-columns: 1fr; } }
.strip-5 > * { grid-column: auto !important; }

/* ══ Destaques do dia ════════════════════════════════════════════════════════ */
.destaque {
  display: grid;
  grid-template-columns: 40px minmax(0, 1fr) 74px;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  text-decoration: none;
  border-bottom: 1px solid var(--line);
}

.destaque:last-child { border-bottom: none; }

@media (hover: hover) and (pointer: fine) {
  .destaque:hover .destaque-cap { color: var(--signal-600); }
}

.destaque-thumb {
  width: 40px; height: 40px;
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg-2);
  display: block;
}

.destaque-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

/* min-width:0 é o que deixa o 1fr encolher e o ellipsis funcionar */
.destaque-meta { display: block; min-width: 0; }

.destaque-cap {
  display: block;
  font-size: 12.5px;
  color: var(--ink-1);
  font-weight: 500;
  line-height: 1.35;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 160ms ease;
}

.destaque-sub {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  margin-top: 3px;
}

.destaque-num {
  display: block;
  text-align: right;
  font-family: var(--font-mono);
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-1);
  font-variant-numeric: tabular-nums;
  line-height: 1.2;
}

.destaque-num small {
  display: block;
  font-size: 9px;
  font-weight: 500;
  color: var(--ink-4);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 1px;
}

/* ══ Horas: mais alto e com faixa de referência ══════════════════════════════ */
.horas { height: 108px; }
.hora-col.pico { background: var(--signal-600); }



/* ══ Sair do modo TV ═════════════════════════════════════════════════════════
   O modo TV esconde a sidebar, que é onde vive o botão que o liga. Sem uma
   saída visível ele vira armadilha: só recarregando a página. */
.tv-sair {
  display: none;
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 300;
  align-items: center;
  gap: 8px;
  padding: 10px 15px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.86);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  color: var(--ink-2);
  font-family: var(--font-body);
  font-size: 12px;
  font-weight: 650;
  cursor: pointer;
  box-shadow: var(--lift-2);
  /* Some sozinho depois de alguns segundos pra não sujar o telão, e volta
     ao primeiro movimento do mouse. */
  opacity: 0;
  transform: translateY(-6px);
  transition: opacity 200ms var(--ease-out), transform 200ms var(--ease-out), border-color 160ms ease;
  pointer-events: none;
}

body.tv-mode .tv-sair { display: flex; }

body.tv-mode.tv-ativo .tv-sair {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}

.tv-sair svg { width: 15px; height: 15px; stroke-width: 2; }

@media (hover: hover) and (pointer: fine) {
  .tv-sair:hover { border-color: var(--signal-500); color: var(--signal-600); }
}

.tv-sair:active { transform: scale(0.97); }

.tv-sair kbd {
  font-family: var(--font-mono);
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 4px;
  background: var(--bg-2);
  color: var(--ink-3);
  border: 1px solid var(--line);
}



/* Área sangra até as bordas do card e vira o rodapé do tile */
.kpi-area {
  display: block;
  width: calc(100% + 36px);
  margin: auto -18px 0;
}

.hero-tile .kpi-area { width: calc(100% + 52px); margin: auto -26px 0; }



/* ══ Mini-barras dos KPIs ════════════════════════════════════════════════════
   Uma barra por dia, a última destacada. Lê melhor que curva neste tamanho. */
.spark-bars {
  display: flex;
  align-items: flex-end;
  gap: 2px;
  height: 36px;
  margin-top: 14px;
  margin-bottom: 16px;
}

.spark-bars i {
  flex: 1;
  background: var(--signal-200);
  border-radius: 2px 2px 0 0;
  min-height: 2px;
  display: block;
}

.spark-bars i.hoje { background: var(--signal-500); }

.hero-tile .spark-bars { margin-bottom: 22px; }



/* Amostra pequena: barra listrada, pra não ler como um resultado firme */
.fmt-preenche.fraca {
  background-image: repeating-linear-gradient(
    -45deg, transparent 0 5px, rgba(255,255,255,0.35) 5px 10px
  );
}

.fmt-num small { white-space: nowrap; }



/* Diz qual intervalo o filtro realmente cobriu. Sem isso, dois períodos com o
   mesmo resultado parecem filtro quebrado, quando é o histórico que ainda não
   chegou lá. */
.cobertura {
  font-size: 11px;
  font-family: var(--font-mono);
  color: var(--ink-4);
  margin-top: 6px;
}

.cobertura.parcial { color: var(--signal-600); }

.cobertura.parcial::before {
  content: '';
  display: inline-block;
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--signal-500);
  margin-right: 6px;
  vertical-align: middle;
}



/* Realce de atualização: some sozinho. Um número que muda sem aviso nenhum
   parece glitch; com um brilho de 700ms lê como "chegou dado novo". */
.kpi-value.subindo,
.hero-value.subindo {
  color: var(--signal-500);
  transition: color 700ms var(--ease-out);
}

.kpi-value.subindo.caindo,
.hero-value.subindo.caindo { color: var(--ink-2); }

/* A seta aparece só durante a animação */
.kpi-value.subindo::after,
.hero-value.subindo::after {
  content: '▲';
  font-size: 0.4em;
  vertical-align: middle;
  margin-left: 0.35em;
  color: var(--gain);
  animation: piscaSeta 700ms var(--ease-out);
}

.kpi-value.subindo.caindo::after,
.hero-value.subindo.caindo::after {
  content: '▼';
  color: var(--ink-4);
}

@keyframes piscaSeta {
  0%   { opacity: 0; transform: translateY(3px); }
  30%  { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; }
}

@media (prefers-reduced-motion: reduce) {
  .kpi-value.subindo::after, .hero-value.subindo::after { animation: none; opacity: 0; }
}



/* ══ Faixa de aviso ══════════════════════════════════════════════════════════
   Só aparece quando há o que avisar. Fica no topo do conteúdo, não sobre ele:
   num telão, alerta que cobre dado é pior que o problema que anuncia. */
.faixa {
  display: none;
  align-items: center;
  gap: 12px;
  padding: 12px 18px;
  border-radius: 12px;
  margin-bottom: 16px;
  font-size: 13px;
  border: 1px solid;
}

.faixa.visivel { display: flex; }

.faixa.atencao {
  background: #FFF8E8;
  border-color: #E8C77A;
  color: #7A5A12;
}

.faixa.critico {
  background: #FDEDEF;
  border-color: #E8A0AA;
  color: #8C1F2E;
}

.faixa.info {
  background: var(--signal-100);
  border-color: var(--signal-200);
  color: var(--signal-700);
}

.faixa svg { width: 18px; height: 18px; flex-shrink: 0; stroke-width: 2; }

.faixa b { font-weight: 700; }

.faixa-acao {
  margin-left: auto;
  font-family: var(--font-mono);
  font-size: 11px;
  opacity: 0.8;
  white-space: nowrap;
}

/* Dado velho: o número continua, mas marcado. Melhor dado antigo identificado
   que tela de erro vermelha no meio da redação. */
body.dado-velho .kpi-value,
body.dado-velho .hero-value { opacity: 0.55; }



/* Faixas de KPI: colunas iguais, independentes do grid de 12. Sem isto os
   cards caíam em 1/12 da largura e cortavam rótulo e número. */
.strip-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.strip-4 > * { grid-column: auto !important; }

@media (max-width: 1100px) { .strip-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 620px)  { .strip-4 { grid-template-columns: 1fr; } }

/* Rótulo do card: cabe em duas linhas em vez de virar reticências */
.kpi-label {
  white-space: normal;
  overflow: visible;
  line-height: 1.3;
}

.kpi-sub {
  line-height: 1.4;
  max-width: 100%;
}

/* ══ Audiência: nome de cidade precisa de espaço ═════════════════════════════ */
.aud-lista .fmt-linha { grid-template-columns: minmax(0, 148px) 1fr 108px; }

.aud-lista .fmt-nome {
  text-transform: none;
  letter-spacing: 0.005em;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-1);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.aud-lista .fmt-uf {
  color: var(--ink-4);
  font-size: 10.5px;
  font-weight: 400;
}

@media (max-width: 1400px) {
  .aud-lista .fmt-linha { grid-template-columns: minmax(0, 120px) 1fr 100px; }
}



/* ══ Tela de login ═══════════════════════════════════════════════════════════
   Cobre tudo até haver token válido. O conteúdo por baixo nem chega a ser
   carregado — nenhuma chamada à API sai antes do login. */
.portao {
  position: fixed;
  inset: 0;
  z-index: 900;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  background: var(--bg);
}

.portao[hidden] { display: none; }

.portao-caixa {
  width: 100%;
  max-width: 372px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 36px 34px 30px;
  box-shadow: var(--lift-3);
  position: relative;
  overflow: hidden;
}

.portao-caixa::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--signal-500), var(--signal-400), var(--signal-500));
  background-size: 200% 100%;
  animation: sweep 9s linear infinite;
}

.portao-marca {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 26px;
}

.portao-marca svg { width: 44px; height: 44px; border-radius: 11px; box-shadow: var(--lift-2); }

.portao-marca h1 {
  font-family: var(--font-display);
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.portao-marca p {
  font-size: 11px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  margin-top: 2px;
}

.campo { margin-bottom: 14px; }

.campo label {
  display: block;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.11em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: 7px;
}

.campo input {
  width: 100%;
  padding: 11px 13px;
  border: 1px solid var(--line-strong);
  border-radius: 10px;
  background: var(--bg);
  font-family: var(--font-body);
  font-size: 14px;
  color: var(--ink-1);
  transition: border-color 160ms ease, background-color 160ms ease;
}

.campo input:focus {
  outline: none;
  border-color: var(--signal-500);
  background: var(--surface);
  box-shadow: 0 0 0 3px rgba(61, 91, 254, 0.12);
}

.portao-btn {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border: none;
  border-radius: 10px;
  background: var(--signal-500);
  color: #fff;
  font-family: var(--font-body);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background-color 160ms ease, transform 140ms var(--ease-out);
}

@media (hover: hover) and (pointer: fine) {
  .portao-btn:hover { background: var(--signal-600); }
}

.portao-btn:active { transform: scale(0.985); }
.portao-btn:disabled { opacity: 0.6; cursor: default; }

.portao-erro {
  display: none;
  margin-top: 12px;
  padding: 9px 12px;
  border-radius: 9px;
  background: #FDEDEF;
  border: 1px solid #E8A0AA;
  color: #8C1F2E;
  font-size: 12px;
}

.portao-erro.visivel { display: block; }

/* Sacode na senha errada: feedback imediato sem precisar ler o aviso */
@keyframes sacode {
  0%, 100% { transform: translateX(0); }
  20%, 60% { transform: translateX(-5px); }
  40%, 80% { transform: translateX(5px); }
}

.portao-caixa.errou { animation: sacode 320ms var(--ease-out); }

.portao-rodape {
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--line);
  font-size: 10.5px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  text-align: center;
}

@media (prefers-reduced-motion: reduce) {
  .portao-caixa.errou { animation: none; }
}

/* Sair: aparece junto das ações da barra lateral */
body.sem-login #btn-sair { display: none; }



/* ══ Esqueletos ══════════════════════════════════════════════════════════════
   Cada um tem a forma do conteúdo que vai substituir. É a diferença entre
   esqueleto e spinner: a página não pula quando o dado chega, porque o espaço
   já estava reservado no tamanho certo. */

.sk-kpi { min-height: 110px; border-radius: 13px; }
.sk-hero { min-height: 210px; border-radius: 16px; }
.sk-linha { height: 66px; border-radius: 12px; }

/* Linha de barra: rótulo, trilho e número, na mesma grade do conteúdo real */
.sk-barra {
  display: grid;
  grid-template-columns: 92px 1fr 116px;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.aud-lista .sk-barra { grid-template-columns: minmax(0, 148px) 1fr 108px; }

.sk-barra span { display: block; height: 12px; border-radius: 4px; }
.sk-barra .sk-trilho { height: 26px; border-radius: 6px; }
.sk-barra .sk-valor { height: 14px; margin-left: auto; width: 62px; }

/* 24 colunas de alturas variadas: dá a silhueta do gráfico de horário */
.sk-horas {
  display: grid;
  grid-template-columns: repeat(24, 1fr);
  gap: 2px;
  align-items: end;
  height: 108px;
}

.sk-horas i { display: block; border-radius: 3px 3px 0 0; }

.sk-grafico { height: 300px; border-radius: 12px; }
.sk-texto { height: 11px; border-radius: 4px; width: 190px; }

/* Entra suave quando o conteúdo real chega, pra não trocar seco */
.chegou { animation: revela 320ms var(--ease-out); }

@keyframes revela {
  from { opacity: 0; transform: translateY(4px); }
  to   { opacity: 1; transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .chegou { animation: none; }
  .skeleton { animation: none; background: var(--bg-2); }
}



/* ══ Meta de 1 milhão ════════════════════════════════════════════════════════ */
.meta-card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 26px 28px;
  box-shadow: var(--lift-2);
  margin-bottom: 12px;
  position: relative;
  overflow: hidden;
}

.meta-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 3px;
  background: linear-gradient(90deg, var(--signal-500), var(--signal-400), var(--signal-500));
  background-size: 200% 100%;
  animation: sweep 9s linear infinite;
}

.meta-topo {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 20px;
}

.meta-data {
  font-family: var(--font-display);
  font-size: clamp(26px, 3vw, 36px);
  font-weight: 600;
  letter-spacing: -0.02em;
  color: var(--ink-1);
  margin-top: 6px;
  line-height: 1.1;
}

.meta-faixa {
  font-size: 11.5px;
  color: var(--ink-3);
  font-family: var(--font-mono);
  margin-top: 7px;
}

.meta-dias { text-align: right; flex-shrink: 0; }

.meta-dias-n {
  font-family: var(--font-display);
  font-size: clamp(34px, 4vw, 48px);
  font-weight: 600;
  color: var(--signal-500);
  line-height: 1;
  font-variant-numeric: tabular-nums;
}

.meta-dias-l {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--ink-3);
  font-weight: 600;
  margin-top: 3px;
}

.meta-trilho {
  height: 12px;
  background: var(--bg-2);
  border-radius: 6px;
  overflow: hidden;
}

.meta-preenche {
  height: 100%;
  border-radius: 6px;
  background: linear-gradient(90deg, var(--signal-600), var(--signal-400));
  transition: width 900ms var(--ease-out);
}

.meta-rodape {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-top: 10px;
  font-size: 12px;
  color: var(--ink-2);
  font-family: var(--font-mono);
}

.meta-rodape b { color: var(--ink-1); font-weight: 600; }

.meta-nota {
  margin-top: 14px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
  font-size: 10.5px;
  color: var(--ink-4);
  font-family: var(--font-mono);
}

.meta-atingida {
  font-family: var(--font-display);
  font-size: 28px;
  font-weight: 600;
  color: var(--gain);
  text-align: center;
  padding: 20px;
}



/* ══ Relatório mensal ════════════════════════════════════════════════════════
   Sobreposição em tela e folha A4 na impressão. As duas coisas saem do mesmo
   HTML: manter dois layouts em sincronia é onde relatório costuma envelhecer. */
.rel-fundo {
  position: fixed;
  inset: 0;
  z-index: 800;
  background: rgba(11, 16, 32, 0.55);
  backdrop-filter: blur(4px);
  overflow-y: auto;
  padding: 28px 20px;
}

.rel-fundo[hidden] { display: none; }

.rel-folha {
  max-width: 820px;
  margin: 0 auto;
  background: #fff;
  border-radius: 14px;
  box-shadow: 0 24px 70px rgba(0,0,0,0.3);
  overflow: hidden;
}

.rel-barra {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 20px;
  background: var(--bg-2);
  border-bottom: 1px solid var(--line);
  position: sticky;
  top: 0;
  z-index: 2;
}

.rel-barra select {
  padding: 7px 10px;
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  background: #fff;
  font-family: var(--font-body);
  font-size: 12.5px;
  color: var(--ink-1);
  cursor: pointer;
}

.rel-barra .espaco { margin-left: auto; }

.rel-btn {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1px solid var(--line-strong);
  background: #fff;
  font-family: var(--font-body);
  font-size: 12.5px;
  font-weight: 600;
  color: var(--ink-2);
  cursor: pointer;
  transition: border-color 160ms ease, color 160ms ease, transform 140ms var(--ease-out);
}

.rel-btn:active { transform: scale(0.97); }
.rel-btn.principal { background: var(--signal-500); border-color: var(--signal-500); color: #fff; }

@media (hover: hover) and (pointer: fine) {
  .rel-btn:hover { border-color: var(--signal-500); color: var(--signal-600); }
  .rel-btn.principal:hover { background: var(--signal-600); color: #fff; }
}

/* ══ Impressão ═══════════════════════════════════════════════════════════════ */
@media print {
  @page { size: A4; margin: 14mm; }
  body > *:not(.rel-fundo) { display: none !important; }
  .rel-fundo {
    position: static; background: none; backdrop-filter: none;
    padding: 0; overflow: visible; display: block !important;
  }
  .rel-folha { max-width: none; box-shadow: none; border-radius: 0; }
  .rel-barra { display: none; }
  .rel-corpo { padding: 0; }
  .rel-secao { page-break-inside: avoid; }
}



/* ══ Relatório v2 ════════════════════════════════════════════════════════════ */
.rel-corpo { padding: 44px 50px 48px; }

.rel-cab {
  display: flex;
  align-items: center;
  gap: 18px;
  padding-bottom: 22px;
  border-bottom: 2px solid var(--ink-1);
  margin-bottom: 30px;
}

.rel-logo { width: 54px; height: 54px; border-radius: 13px; flex-shrink: 0; }

.rel-cab-tit { flex: 1; min-width: 0; }

.rel-cab h1 {
  font-family: var(--font-display);
  font-size: 21px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.15;
}

.rel-cab .periodo {
  font-size: 12.5px;
  color: var(--ink-2);
  margin-top: 3px;
}

.rel-cab .emissao {
  font-size: 10px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  text-align: right;
  line-height: 1.6;
  flex-shrink: 0;
}

/* ── Destaques: a análise, em cima de tudo ── */
.rel-destaques {
  background: var(--signal-100);
  border: 1px solid var(--signal-200);
  border-radius: 12px;
  padding: 20px 22px;
  margin-bottom: 30px;
}

.rel-destaques h2 {
  font-family: var(--font-display);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--signal-600);
  margin-bottom: 13px;
}

.rel-destaques ul { list-style: none; margin: 0; padding: 0; }

.rel-destaques li {
  display: flex;
  gap: 10px;
  font-size: 12.5px;
  line-height: 1.55;
  color: var(--ink-1);
  padding: 5px 0;
}

.rel-destaques li::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--signal-500);
  flex-shrink: 0;
  margin-top: 8px;
}

.rel-destaques b { font-weight: 700; }

.rel-secao { margin-bottom: 28px; page-break-inside: avoid; }

.rel-secao h2 {
  font-family: var(--font-display);
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: var(--ink-3);
  padding-bottom: 8px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 18px;
}

.rel-grade { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }

.rel-num .rel-v {
  font-family: var(--font-display);
  font-size: 25px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.1;
}

.rel-num .rel-l {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--ink-3);
  font-weight: 600;
  margin-top: 5px;
}

.rel-num .rel-s {
  font-size: 10px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  margin-top: 3px;
}

.rel-num.rel-num-ganho .rel-v { color: var(--gain); }

/* ── Gráfico do relatório ── */
.rel-gr { margin-top: 20px; }
.rel-gr svg { display: block; width: 100%; height: 132px; }

/* ── Tabelas ── */
.rel-tabela { width: 100%; border-collapse: collapse; font-size: 11.5px; }

.rel-tabela th {
  text-align: left;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--ink-3);
  font-weight: 600;
  padding: 0 10px 8px 0;
  border-bottom: 1px solid var(--line);
}

.rel-tabela td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
.rel-tabela .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.rel-tabela .cap { max-width: 250px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rel-tabela tr:last-child td { border-bottom: none; }
.rel-tabela .pos { color: var(--ink-4); width: 18px; }

.rel-tag {
  display: inline-block;
  font-size: 8px;
  font-weight: 700;
  letter-spacing: 0.07em;
  padding: 2px 5px;
  border-radius: 4px;
  background: var(--signal-100);
  color: var(--signal-600);
}

/* Barra dentro da tabela de formatos */
.rel-barra-cel { width: 130px; }
.rel-barra-tr { height: 8px; background: var(--bg-2); border-radius: 4px; overflow: hidden; }
.rel-barra-pr { height: 100%; background: var(--signal-500); border-radius: 4px; }

/* ── Projeção ── */
.rel-proj {
  display: flex;
  align-items: center;
  gap: 22px;
  padding: 16px 18px;
  background: var(--bg-2);
  border-radius: 11px;
}

.rel-proj-data {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
}

.rel-proj-tr { flex: 1; height: 9px; background: #fff; border-radius: 5px; overflow: hidden; }
.rel-proj-pr { height: 100%; background: linear-gradient(90deg, var(--signal-600), var(--signal-400)); }

.rel-rodape {
  margin-top: 32px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 9.5px;
  color: var(--ink-4);
  font-family: var(--font-mono);
  line-height: 1.7;
}

@media print {
  .rel-destaques { background: #F4F6FF !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .rel-corpo { padding: 0; }
}



/* ══ Publicações clicáveis no relatório ══════════════════════════════════════
   Salvo em PDF, o link continua funcionando — quem recebe o relatório abre a
   publicação direto, sem precisar caçar no perfil. */
.rel-post { display: flex; align-items: center; gap: 11px; min-width: 0; }

.rel-thumb {
  width: 42px; height: 42px;
  border-radius: 7px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--bg-2);
  border: 1px solid var(--line);
}

.rel-post-txt { min-width: 0; flex: 1; }

.rel-link {
  color: var(--ink-1);
  text-decoration: none;
  border-bottom: 1px solid transparent;
}

.rel-link:hover { color: var(--signal-600); border-bottom-color: var(--signal-200); }

.rel-abrir {
  font-size: 8.5px;
  font-family: var(--font-mono);
  color: var(--signal-500);
  text-decoration: none;
  white-space: nowrap;
}

/* Destaque com a publicação em evidência, dentro do bloco de análise */
.rel-mencao {
  display: flex;
  gap: 13px;
  align-items: center;
  margin-top: 14px;
  padding: 12px 14px;
  background: #fff;
  border: 1px solid var(--signal-200);
  border-radius: 10px;
  text-decoration: none;
}

.rel-mencao img {
  width: 54px; height: 54px;
  border-radius: 8px;

// Ranking guardado pelo snapshot noturno: 35 dias de recentes + top de sempre

// O dia de hoje vem ao vivo: o snapshot só grava o dia já fechado
async function fetchTopHoje(){

function formatNum(n) {
  if (n === null || n === undefined) return '—';
  return n.toLocaleString('pt-BR');
}

// Comparativo com ontem. O dia de hoje ainda está correndo, então uma seta
// vermelha ficaria acesa a maior parte do tempo só porque o dia não acabou.
// Mostra o valor de ontem como referência e só comemora quando já superou.
function delta(hoje, ontem) {
  if (hoje == null || ontem == null) {
    return '<div class="stat-card-delta delta-flat">sem comparativo ainda</div>';
  }
  if (hoje >= ontem) {
    return `<div class="stat-card-delta delta-up">↑ já passou ontem (${formatNum(ontem)})</div>`;
  }
  const pct = Math.round((hoje / ontem) * 100);
  return `<div class="stat-card-delta delta-flat">ontem fechou em ${formatNum(ontem)} · ${pct}%</div>`;
}

function fmtTime() {
  return new Date().toLocaleString('pt-BR', { hour: '2-digit', minute: '2-digit' });
}

// ── Gráfico de linha ────────────────────────────────────────────────────────
// Uma série só, então não leva legenda: o título já diz o que é.
// Rótulos são seletivos (primeiro, último e o pico) — número em cima de cada
// ponto vira ruído e some com a leitura da forma, que é o que importa aqui.

function compacto(n){
  if(n == null) return '—';
  if(Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2).replace('.', ',') + ' mi';
  if(Math.abs(n) >= 1e3) return (n / 1e3).toFixed(1).replace('.', ',') + ' mil';
  return String(n);
}

function diaMes(d){
  return d ? d.slice(8) + '/' + d.slice(5, 7) : '';
}

// ── Sparkline ───────────────────────────────────────────────────────────────
// A pesquisa de dashboards converge num ponto: KPI card são três camadas —
// número, delta e tendência. Sem a tendência o número não diz se é bom.
// Sem eixo, sem grade, sem rótulo: é forma, não leitura precisa.

// Card da faixa de insights: rótulo, número, uma linha de contexto. Nada mais.
function kpiSimples(rotulo, valor, sub, destaque, ganho){
  return '<div class="kpi" style="min-height:110px;padding-bottom:16px">' +
    '<div class="kpi-top"><span class="kpi-label">' + rotulo + '</span></div>' +
    '<div class="kpi-value" style="' + (destaque ? 'color:var(--signal-600);' : ganho ? 'color:var(--gain);' : '') +
      (String(valor).length > 11 ? 'font-size:20px;' : String(valor).length > 7 ? 'font-size:24px;' : '') +
      'white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + valor + '</div>' +
    (sub ? '<div class="kpi-sub">' + sub + '</div>' : '') +
    '</div>';
}




// Mini-barras: uma barra por dia, a última destacada. Em 34px de altura isso
// lê melhor que uma curva — dá pra apontar o dia alto sem seguir a linha.
function sparkBars(valores, opts){
  const o = typeof opts === 'number' ? { n: opts } : (opts || {});
  const n = o.n || 14;
  const vals = (valores || []).filter(v => typeof v === 'number').slice(-n);
  if(vals.length < 2) return '<div class="spark-bars"></div>';
  const max = Math.max(...vals), min = Math.min(...vals);
  const span = (max - min) || 1;
  const est = o.alt ? ' style="height:' + o.alt + 'px"' : '';
  return '<div class="spark-bars"' + est + '>' + vals.map((v, i) => {
    // Piso de 18% pra barra baixa ainda existir como barra
    const alt = 18 + ((v - min) / span) * 82;
    const ultima = i === vals.length - 1 ? ' class="hoje"' : '';
    return '<i' + ultima + ' style="height:' + alt.toFixed(1) + '%"></i>';
  }).join('') + '</div>';
}

// Interpolação monótona (Fritsch–Carlson). Uma spline comum inventa picos
// entre os pontos — num gráfico de dado real isso é mentira. Esta mantém a
// curva presa aos valores: se dois dias sobem, a curva não desce no meio.
function caminhoSuave(pts){
  const n = pts.length;
  if(n < 2) return '';
  if(n === 2) return 'M' + pts[0][0] + ' ' + pts[0][1] + ' L' + pts[1][0] + ' ' + pts[1][1];

  const dx = [], dy = [], m = [];
  for(let i = 0; i < n - 1; i++){
    dx[i] = pts[i+1][0] - pts[i][0];
    dy[i] = pts[i+1][1] - pts[i][1];
    m[i] = dy[i] / (dx[i] || 1);
  }

  const t = [m[0]];
  for(let i = 1; i < n - 1; i++){
    if(m[i-1] * m[i] <= 0){
      t[i] = 0; // ponto de virada: tangente zero trava o overshoot
    }else{
      t[i] = (m[i-1] + m[i]) / 2;
      const lim = 3 * Math.min(Math.abs(m[i-1]), Math.abs(m[i]));
      if(Math.abs(t[i]) > lim) t[i] = Math.sign(t[i]) * lim;
    }
  }
  t[n-1] = m[n-2];

  let d = 'M' + pts[0][0].toFixed(1) + ' ' + pts[0][1].toFixed(1);
  for(let i = 0; i < n - 1; i++){
    const c = dx[i] / 3;
    d += ' C' + (pts[i][0] + c).toFixed(1) + ' ' + (pts[i][1] + t[i] * c).toFixed(1) +
         ' ' + (pts[i+1][0] - c).toFixed(1) + ' ' + (pts[i+1][1] - t[i+1] * c).toFixed(1) +
         ' ' + pts[i+1][0].toFixed(1) + ' ' + pts[i+1][1].toFixed(1);
  }
  return d;
}

// Sparkline de área. A primeira tentativa era uma linha de 1.8px em 40px de
// altura: some no card e vira rabisco. Aqui o preenchimento é que carrega a
// leitura — a forma se vê de longe — e a linha só define a borda de cima.
function sparkArea(valores, opts){
  const o = opts || {};
  const n = o.n || 14;
  const h = o.alt || 54;
  const vals = (valores || []).filter(v => typeof v === 'number').slice(-n);
  if(vals.length < 2) return '<div class="kpi-area" style="height:' + h + 'px"></div>';

  const w = 300;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  const topo = 6, base = h - 1;

  const pts = vals.map((v, i) => [
    (i / (vals.length - 1)) * w,
    topo + (base - topo) - ((v - min) / span) * (base - topo)
  ]);

  const linha = caminhoSuave(pts);
  const area = linha + ' L' + w + ' ' + h + ' L0 ' + h + ' Z';
  const id = 'ar' + Math.random().toString(36).slice(2, 8);
  const fim = pts[pts.length - 1];

  return '<svg class="kpi-area" viewBox="0 0 ' + w + ' ' + h + '" height="' + h + '"' +
    ' preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="0" y2="1">' +
      '<stop offset="0%" stop-color="var(--signal-500)" stop-opacity="0.26"/>' +
      '<stop offset="100%" stop-color="var(--signal-500)" stop-opacity="0.02"/>' +
    '</linearGradient></defs>' +
    '<path d="' + area + '" fill="url(#' + id + ')"/>' +
    '<path d="' + linha + '" fill="none" stroke="var(--signal-500)" stroke-width="2"' +
      ' stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + fim[0].toFixed(1) + '" cy="' + fim[1].toFixed(1) + '" r="3"' +
      ' fill="var(--signal-500)" stroke="var(--surface)" stroke-width="1.5"' +
      ' vector-effect="non-scaling-stroke"/>' +
    '</svg>';
}

// Fração do dia já decorrida em Brasília
function fracaoDoDia(){
  const agora = new Date();
  const p = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/Sao_Paulo', hour12: false, hour: '2-digit', minute: '2-digit'
  }).formatToParts(agora).reduce((a, x) => (a[x.type] = x.value, a), {});
  const h = (p.hour === '24' ? 0 : +p.hour) + (+p.minute) / 60;
  return Math.max(0.04, h / 24);
}

// Delta contra o RITMO esperado, não contra o dia inteiro de ontem.
// Comparar um dia pela metade com um dia fechado deixava tudo vermelho às 14h.
function chipRitmo(atual, media7, chave){
  const marca = chave ? ' data-chip="' + chave + '"' : '';
  if(atual == null || !media7) return '<span class="kpi-delta flat"' + marca + '>—</span>';
  const esperado = media7 * fracaoDoDia();
  if(!esperado) return '<span class="kpi-delta flat"' + marca + '>—</span>';
  const pct = ((atual - esperado) / esperado) * 100;
  const classe = pct >= 5 ? 'up' : pct <= -5 ? 'down' : 'flat';
  const seta = pct >= 5 ? '↑' : pct <= -5 ? '↓' : '→';
  const n = Math.min(999, Math.round(Math.abs(pct)));
  return '<span class="kpi-delta ' + classe + '"' + marca +
    ' title="comparado ao ritmo esperado para esta hora">' + seta + ' ' + n + '%</span>';
}

function sparkline(valores, opts){
  const o = opts || {};
  const cor = o.cor || 'var(--signal-500)';
  const alt = o.alt || 40;
  const vals = (valores || []).filter(v => typeof v === 'number');
  if(vals.length < 2) return `<div style="height:${alt}px"></div>`;

  const w = 240, h = alt;
  const min = Math.min(...vals), max = Math.max(...vals);
  const span = (max - min) || 1;
  // Ocupa só a metade de baixo do espaço: a linha respira sem encostar no topo
  const topo = h * 0.28;
  const X = i => (i / (vals.length - 1)) * w;
  const Y = v => topo + (h - topo - 2) - ((v - min) / span) * (h - topo - 4);

  const pts = vals.map((v, i) => [X(i), Y(v)]);
  const linha = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const area = linha + ` L ${w} ${h} L 0 ${h} Z`;
  const id = 'sk' + Math.random().toString(36).slice(2, 8);
  const fim = pts[pts.length - 1];

  return `<svg class="kpi-spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${cor}" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="${cor}" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${area}" fill="url(#${id})"/>
    <path d="${linha}" fill="none" stroke="${cor}" stroke-width="1.8"
          stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle cx="${fim[0].toFixed(1)}" cy="${fim[1].toFixed(1)}" r="2.6" fill="${cor}"
            vector-effect="non-scaling-stroke"/>
  </svg>`;
}

// Delta como chip: seta e percentual, sem frase. Compara o valor de hoje
// (parcial) com a média dos dias fechados, não com o total de ontem — senão
// ficaria vermelho o dia inteiro só porque o dia não acabou.
function chipDelta(hoje, referencia, opts){
  const o = opts || {};
  const marca = o.chave ? ' data-chip="' + o.chave + '"' : '';
  if(hoje == null || referencia == null || !referencia){
    return '<span class="kpi-delta flat"' + marca + '>—</span>';
  }
  const pct = ((hoje - referencia) / referencia) * 100;
  const classe = pct >= 3 ? 'up' : pct <= -3 ? 'down' : 'flat';
  const seta = pct >= 3 ? '↑' : pct <= -3 ? '↓' : '→';
  const n = Math.abs(pct) >= 100 ? Math.round(Math.abs(pct)) : Math.abs(pct).toFixed(0);
  return '<span class="kpi-delta ' + classe + '"' + marca + '>' + seta + ' ' + n + '%</span>';
}

// Média dos últimos N dias fechados, para a métrica pedida
function mediaDe(history, campo, n){
  const vals = history.slice(-n).map(h => h[campo]).filter(v => typeof v === 'number');
  if(!vals.length) return null;
  return vals.reduce((a, b) => a + b, 0) / vals.length;
}

function serieDe(history, campo, n){
  return history.slice(-(n || 21)).map(h => h[campo]).filter(v => typeof v === 'number');
}

// ── Insights calculados ─────────────────────────────────────────────────────
// Tudo aqui sai dos dados que já temos. Nada é texto explicativo: são números
// que respondem sozinhos "qual formato rende mais" e "que horário rende mais".

function analisaFormatos(posts){
  const grupos = { REEL: [], CARROSSEL: [], IMAGEM: [] };
  posts.forEach(p => {
    const k = p.isVideo ? 'REEL' : p.media_type === 'CAROUSEL_ALBUM' ? 'CARROSSEL' : 'IMAGEM';
    if(typeof p.interactions === 'number') grupos[k].push(p);
  });
  const linhas = Object.entries(grupos).map(([nome, lista]) => {
    const total = lista.reduce((a, p) => a + (p.interactions || 0), 0);
    return {
      nome,
      qtd: lista.length,
      media: lista.length ? Math.round(total / lista.length) : 0,
      alcance: lista.length ? Math.round(lista.reduce((a, p) => a + (p.reach || 0), 0) / lista.length) : 0
    };
  }).filter(l => l.qtd > 0);
  linhas.sort((a, b) => b.media - a.media);
  return linhas;
}

function analisaHoras(posts){
  const balde = Array.from({ length: 24 }, () => ({ soma: 0, qtd: 0 }));
  posts.forEach(p => {
    if(!p.hora || typeof p.interactions !== 'number') return;
    const h = parseInt(p.hora.slice(0, 2), 10);
    if(isNaN(h)) return;
    balde[h].soma += p.interactions;
    balde[h].qtd++;
  });
  const medias = balde.map(b => b.qtd ? b.soma / b.qtd : 0);
  const max = Math.max(...medias) || 1;
  const melhor = medias.indexOf(max);
  return { medias, max, melhor };
}

function lineChartSvg(dates, values) {
  if(!values || values.length < 2) return '';

  const w = 1000, h = 300;
  const padL = 58, padR = 26, padT = 26, padB = 34;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;

  const min = Math.min(...values);
  const max = Math.max(...values);
  // Respiro de 12% pra linha não encostar no teto nem no chão do painel
  const folga = (max - min) * 0.12 || Math.max(1, max * 0.001);
  const lo = min - folga, hi = max + folga;
  const span = hi - lo || 1;

  const X = i => padL + (i / (values.length - 1)) * plotW;
  const Y = v => padT + plotH - ((v - lo) / span) * plotH;

  const pts = values.map((v, i) => ({ x: X(i), y: Y(v), v, d: dates[i] }));
  const linha = pts.map((p, i) => (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const area = linha + ` L ${pts[pts.length-1].x.toFixed(1)} ${padT + plotH} L ${pts[0].x.toFixed(1)} ${padT + plotH} Z`;

  // Grade recessiva: quatro linhas, o suficiente pra ancorar a leitura
  let grade = '', eixoY = '';
  for(let i = 0; i <= 3; i++){
    const v = lo + (span * i / 3);
    const y = Y(v);
    grade += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    eixoY += `<text x="${padL - 12}" y="${(y + 4).toFixed(1)}" text-anchor="end" font-size="11" font-family="var(--font-mono)" fill="var(--ink-4)">${compacto(Math.round(v))}</text>`;
  }

  // No máximo 6 datas no eixo, senão os rótulos colidem
  const passo = Math.max(1, Math.ceil(pts.length / 6));
  let eixoX = '';
  pts.forEach((p, i) => {
    if(i % passo === 0 || i === pts.length - 1){
      eixoX += `<text x="${p.x.toFixed(1)}" y="${h - 10}" text-anchor="middle" font-size="11" font-family="var(--font-mono)" fill="var(--ink-4)">${diaMes(p.d)}</text>`;
    }
  });

  const ultimo = pts[pts.length - 1];
  const primeiro = pts[0];
  const iPico = values.indexOf(max);
  const pico = pts[iPico];

  // Rótulo direto só onde carrega informação: começo, fim e o pico
  function rotulo(p, texto, cor, ancora){
    const dx = ancora === 'end' ? -10 : ancora === 'start' ? 10 : 0;
    return `<text x="${(p.x + dx).toFixed(1)}" y="${(p.y - 14).toFixed(1)}" text-anchor="${ancora}"
      font-size="12" font-weight="700" font-family="var(--font-mono)" fill="${cor}">${texto}</text>`;
  }

  let rotulos = rotulo(primeiro, compacto(primeiro.v), 'var(--ink-3)', 'start');
  if(iPico !== 0 && iPico !== pts.length - 1){
    rotulos += rotulo(pico, compacto(pico.v), 'var(--peak)', 'middle');
    rotulos += `<circle cx="${pico.x.toFixed(1)}" cy="${pico.y.toFixed(1)}" r="4" fill="var(--peak)" stroke="var(--surface)" stroke-width="2"/>`;
  }
  rotulos += rotulo(ultimo, compacto(ultimo.v), 'var(--signal-600)', 'end');

  return `
  <svg viewBox="0 0 ${w} ${h}" width="100%" height="300" preserveAspectRatio="none" class="grafico" role="img"
       aria-label="Evolução de seguidores de ${diaMes(primeiro.d)} a ${diaMes(ultimo.d)}">
    <defs>
      <linearGradient id="gradArea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="var(--signal-500)" stop-opacity="0.18"/>
        <stop offset="100%" stop-color="var(--signal-500)" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grade}
    <path d="${area}" fill="url(#gradArea)"/>
    <path d="${linha}" fill="none" stroke="var(--signal-500)" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" class="grafico-linha"/>
    ${eixoY}${eixoX}${rotulos}
    <circle cx="${ultimo.x.toFixed(1)}" cy="${ultimo.y.toFixed(1)}" r="5"
            fill="var(--signal-500)" stroke="var(--surface)" stroke-width="2.5"/>
    <g class="crosshair" style="opacity:0">
      <line y1="${padT}" y2="${padT + plotH}" stroke="var(--signal-400)" stroke-width="1" stroke-dasharray="3 3"/>
      <circle r="6" fill="var(--signal-500)" stroke="var(--surface)" stroke-width="2.5"/>
    </g>
  </svg>
  <div class="tooltip-grafico" role="status"></div>`;
}

// Crosshair + tooltip. A skill de dataviz trata isso como padrão, não extra:
// um gráfico em HTML é interativo por natureza.
function ligarHoverGrafico(el, dates, values){
  const svg = el.querySelector('svg.grafico');
  const tip = el.querySelector('.tooltip-grafico');
  if(!svg || !tip || values.length < 2) return;

  const w = 1000, padL = 58, padR = 26, padT = 26, padB = 34, h = 300;
  const plotW = w - padL - padR;
  const plotH = h - padT - padB;
  const min = Math.min(...values), max = Math.max(...values);
  const folga = (max - min) * 0.12 || Math.max(1, max * 0.001);
  const lo = min - folga, span = (max + folga) - lo || 1;

  const cross = svg.querySelector('.crosshair');
  const linha = cross.querySelector('line');
  const bola = cross.querySelector('circle');

  function mover(ev){
    const r = svg.getBoundingClientRect();
    const px = (ev.clientX - r.left) / r.width * w;
    const frac = (px - padL) / plotW;
    const i = Math.max(0, Math.min(values.length - 1, Math.round(frac * (values.length - 1))));

    const x = padL + (i / (values.length - 1)) * plotW;
    const y = padT + plotH - ((values[i] - lo) / span) * plotH;

    linha.setAttribute('x1', x); linha.setAttribute('x2', x);
    bola.setAttribute('cx', x); bola.setAttribute('cy', y);
    cross.style.opacity = '1';

    const ganho = i > 0 ? values[i] - values[i - 1] : null;
    tip.innerHTML =
      `<div class="tip-data">${diaMes(dates[i])}</div>` +
      `<div class="tip-valor">${values[i].toLocaleString('pt-BR')}</div>` +
      (ganho !== null
        ? `<div class="tip-ganho">${ganho >= 0 ? '+' : ''}${ganho.toLocaleString('pt-BR')} no dia</div>`
        : '<div class="tip-ganho">primeiro registro</div>');

    // Vira o tooltip pro outro lado perto da borda pra não sair da caixa
    const px2 = x / w * r.width;
    tip.style.left = px2 + 'px';
    tip.style.transform = px2 > r.width - 130 ? 'translate(-100%, -50%)' : 'translate(14px, -50%)';
    tip.style.top = (y / h * r.height) + 'px';
    tip.classList.add('visivel');
  }

  function sair(){
    cross.style.opacity = '0';
    tip.classList.remove('visivel');
  }

  svg.addEventListener('pointermove', mover);
  svg.addEventListener('pointerleave', sair);
}

function barChartSvg(dates, values) {
  if(!values.length) return '';
  const h = 200, w = 600, padding = 40;
  const maxVal = Math.max(...values, 1);
  const barWidth = (w - padding * 2) / values.length * 0.7;
  const barGap = (w - padding * 2) / values.length;

  const bars = values.map((v, i) => {
    const x = padding + i * barGap + (barGap - barWidth) / 2;
    const barH = (v / maxVal) * (h - padding * 2);
    const y = h - padding - barH;
    return `<rect x="${x}" y="${y}" width="${barWidth}" height="${barH}" fill="#3D5BFE" rx="3"/>`;
  }).join('');

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:100%;">
    ${bars}
  </svg>`;
}

    [data, history, posts] = await Promise.all([fetchAllData(), fetchHistory(), fetchPosts()]);

  }catch(e){
    // Cai pro último retrato bom em vez de sumir com o painel
    const guardado = lerEstado();
    if(!guardado){
      document.getElementById('app').innerHTML =
        '<div class="loading" style="flex-direction:column;gap:10px">' +
        '<div>Não foi possível carregar os dados</div>' +
        '<div style="font-size:11px;opacity:.7">' + e.message + '</div></div>';
      mostrarFaixa('critico', '<b>Sem conexão com a API.</b> Nada foi carregado ainda.', 'tentando de novo em 1 min');
      setTimeout(() => location.reload(), 60000);
      return;
    }
    data = guardado.data;
    history = guardado.history || [];
    posts = { posts: [], resumo: null };
    document.body.classList.add('dado-velho');
    mostrarFaixa('atencao',
      '<b>Mostrando os últimos dados recebidos.</b> A conexão com o Instagram falhou agora há pouco.',
      'há ' + minutosDesde(guardado.quando) + ' min');
  }

  try{
    if(history.length > 0) {
      const sorted = [...history].sort((a,b) => a.date.localeCompare(b.date));

      // A referência é o último dia COM contagem, não necessariamente o
      // último dia. Quando o snapshot atrasa, aquele dia fica sem valor —
      // e usar o último cegamente mostrava um risco no lugar do ganho.
      const ref = [...sorted].reverse().find(h => h.followers != null) || null;
      if(ref){
        data.dailyGain = data.profile.followers_count - ref.followers;
        data.ganhoRef = ref;
        // Quantos dias esse ganho abrange, pra não chamar de "hoje" o que é
        // acúmulo de mais de um dia
        const fim = new Date(ref.date + 'T00:00:00-03:00').getTime() + 86400000;
        data.ganhoDias = Math.max(1, Math.ceil((Date.now() - fim) / 86400000));
      }

      data.ontem = sorted[sorted.length - 1] || null;
      data.historico = sorted;
    }

    renderDashboard(data);
    renderPosts(posts.posts, posts.resumo);

    // Só avisa do token se não houver aviso mais urgente na tela
    if(!document.body.classList.contains('dado-velho')) avisarToken(data.tokenStatus);

    Promise.all([fetchTopHoje(), fetchTopGuardado()])
      .then(([hoje, guardado]) => renderTop(hoje, guardado))
      .catch(() => {});

    carregarAudiencia();
    carregarStories();
  }catch(e){
    document.getElementById('app').innerHTML =
      '<div class="loading" style="color:var(--drop)">Erro ao montar o painel: ' + e.message + '</div>';
  }
}
