name: Snapshot diário do Instagram

on:
  schedule:
    # 02:50 UTC = 23:50 no horário de Brasília (fixo, sem horário de verão desde 2019)
    - cron: '50 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Captura snapshot do dia
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: node scripts/snapshot.mjs

      - name: Commita se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json
          git diff --cached --quiet || git commit -m "Snapshot diário: $(date -u +%F)"
          git push
