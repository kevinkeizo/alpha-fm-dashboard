name: Snapshot diário do Instagram

on:
  schedule:
    # 04:00 UTC = 01:00 em Brasília. O script grava o dia ANTERIOR, já fechado,
    # então o atraso comum do agendador do GitHub não joga a captura no dia errado.
    - cron: '0 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Captura snapshot do dia
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: node scripts/snapshot.mjs

      - name: Commita se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add history.json top-posts.json
          git diff --cached --quiet || git commit -m "Snapshot diário: $(TZ=America/Sao_Paulo date -d yesterday +%F)"
          git push
