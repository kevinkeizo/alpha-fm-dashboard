name: Renova token do Instagram

on:
  schedule:
    # Roda a cada 55 dias (no dia 1, 56, 111, etc)
    - cron: '0 3 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Renova token
        id: renew
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          IG_USER_ID: ${{ vars.IG_USER_ID }}
        run: |
          node scripts/renew-token.mjs > /tmp/renew-output.txt 2>&1
          cat /tmp/renew-output.txt
          # Extrai o novo token da output
          NEW_TOKEN=$(grep "^NEW_TOKEN=" /tmp/renew-output.txt | cut -d= -f2)
          if [ -z "$NEW_TOKEN" ]; then
            echo "❌ Falha ao extrair novo token"
            exit 1
          fi
          echo "token_renewed=true" >> $GITHUB_OUTPUT
          echo "new_token=$NEW_TOKEN" >> $GITHUB_OUTPUT

      - name: Notifica sucesso
        if: success()
        run: |
          echo "✅ Token renovado com sucesso!"
          echo "O novo token está pronto. Próxima renovação em 55 dias."

      - name: Notifica falha
        if: failure()
        run: |
          echo "❌ FALHA NA RENOVAÇÃO DE TOKEN"
          echo "Ação necessária: Renova manualmente em developers.facebook.com e atualiza o Secret IG_TOKEN"
          exit 1
